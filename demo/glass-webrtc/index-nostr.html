<!doctype html>
<!-- NOTE: this standalone page is NOT what the nsite serves.  The deployed client is
     built from entry.mjs (see DEPLOY.md); the touch/gesture layer is duplicated here.
     A fix applied only to this file will not reach the device. -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>glass over WebRTC · Nostr (NIP-07)</title>
  <style>
    html,body{margin:0;height:100%;background:#111;overflow:hidden}#screen{width:100vw;height:100vh}
    #hud{position:fixed;top:0;left:0;right:0;z-index:12;font:11px/1.4 ui-monospace,Menlo,monospace;
         color:#7CFC9B;background:rgba(0,0,0,.72);padding:5px 8px;
         white-space:pre;pointer-events:none;text-shadow:0 0 2px #000}
    #hud b{color:#fff;font-weight:600}
    #diag{position:fixed;top:74px;left:0;right:0;z-index:12;max-height:40vh;overflow:hidden;
          font:10px/1.32 ui-monospace,Menlo,monospace;color:#a9d9ff;background:rgba(0,0,0,.5);
          padding:4px 8px;white-space:pre-wrap;pointer-events:none;text-shadow:0 0 2px #000}
    /* clean connecting overlay (non-debug), covers the blank screen until the first frame paints */
    #connstatus{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(130% 100% at 50% 38%,#141a21 0%,#0b0d11 100%);color:#e8eef2;
      font:15px/1.5 -apple-system,system-ui,sans-serif;transition:opacity .42s ease}
    /* The connect sequence as a checklist: what is done, what is happening, what is still ahead.
       A spinner alone says "wait"; this says WHERE we are, and — once a step is behind us — what it
       actually found.  That second line is the part worth having: "3 relay candidates" or
       "relay->srflx 147ms" is exactly what you would otherwise open the debug log to learn. */
    #connstatus .card{display:flex;flex-direction:column;align-items:stretch;gap:14px;
      text-align:left;padding:28px;min-width:264px;max-width:min(86vw,340px)}
    /* Which box is this?  Answered before the first packet — see the note at LEARNT-NAME. */
    #connstatus .who{display:flex;flex-direction:column;gap:2px;margin:-4px 0 2px}
    #connstatus .who .nm{font-size:15px;font-weight:600;letter-spacing:.01em;color:#eef4f8}
    #connstatus .who .nm.unknown{font-weight:500;color:#9fb0bd}
    #connstatus .who .id{font-size:11.5px;font-variant-numeric:tabular-nums;color:#7d8b96;
      letter-spacing:.04em}
    #connstatus .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
    #connstatus .steps li{position:relative;display:grid;grid-template-columns:16px 1fr;
      column-gap:12px;padding:6px 0;color:rgba(232,238,242,.34);transition:color .4s ease}
    #connstatus .steps li .lbl{grid-column:2;grid-row:1;font-weight:500;letter-spacing:.01em}
    /* the detail collapses to nothing until its step completes, so future steps stay quiet */
    #connstatus .steps li .det{grid-column:2;grid-row:2;font-size:12.5px;font-variant-numeric:tabular-nums;
      color:rgba(232,238,242,.44);max-height:0;opacity:0;overflow:hidden;
      transition:max-height .4s ease,opacity .4s ease,margin .4s ease}
    #connstatus .steps li.done{color:#e8eef2}
    #connstatus .steps li.done .det{max-height:2.4em;opacity:1;margin-top:3px}
    #connstatus .steps li.now{color:#e8eef2}
    /* marker: hollow ring ahead, spinner now, filled behind */
    #connstatus .steps li b{grid-column:1;grid-row:1;width:14px;height:14px;margin-top:3px;
      box-sizing:border-box;border-radius:50%;border:2px solid rgba(255,255,255,.2);
      transition:border-color .4s ease,background .4s ease}
    #connstatus .steps li.done b{border-color:#7CFC9B;background:#7CFC9B}
    #connstatus .steps li.now b{border-color:rgba(124,252,155,.28);border-top-color:#7CFC9B;
      animation:spin .9s linear infinite}
    /* the rail: makes the list read as a sequence rather than four unrelated rows */
    #connstatus .steps li:not(:last-child)::before{content:'';position:absolute;left:7px;top:20px;
      bottom:-4px;width:2px;background:rgba(255,255,255,.12);transition:background .4s ease}
    #connstatus .steps li.done::before{background:rgba(124,252,155,.45)}
    #connstatus .steps li.fail{color:#ffd0d0}
    #connstatus .steps li.fail b{border-color:#f0645a;background:transparent;animation:none}
    #connstatus .msg{font-weight:500;letter-spacing:.01em;min-height:1.4em;text-align:center}
    #connstatus .msg:empty{min-height:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* --- the link-status pill -----------------------------------------------------------------
       The connecting overlay only exists until the first frame, and after that nothing on screen
       ever said whether the link was still there — so the only way to find out was to drag a
       window title and see if it moved.  This is the part that is always present.

       It is a 7px dot while the link is healthy and words only when there is something to say,
       because a status line you have learned to ignore is worth the same as no status line at
       all.  It never covers the desktop: 5px of top edge, centred, and the desktop shows through
       until the moment it has to be read. */
    #linkstat{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:26;
      display:flex;align-items:center;gap:8px;max-width:min(92vw,420px);
      padding:5px 9px;border-radius:16px;background:transparent;
      font:13px/1.25 -apple-system,system-ui,sans-serif;color:#e8eef2;
      pointer-events:none;transition:background .25s ease}
    /* display:flex above beats [hidden]'s UA display:none, so say it again */
    #linkstat[hidden]{display:none}
    /* the hud takes the top strip in debug mode; drop into the gap above the log rather than
       stacking on top of it */
    body.dbg #linkstat{top:72px}
    #linkstat .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:#7CFC9B;
      opacity:.4;transition:background .25s ease,opacity .25s ease}
    #linkstat .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      max-width:0;opacity:0;transition:max-width .3s ease,opacity .3s ease}
    #linkstat button{display:none;pointer-events:auto;touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;border:1px solid currentColor;background:transparent;
      color:inherit;border-radius:11px;padding:4px 10px;white-space:nowrap;
      font:600 12px/1 -apple-system,system-ui,sans-serif}
    /* ANYTHING that is not "live" says so in words.  One rule, so a state can never be added
       that lights the dot and forgets to explain itself. */
    #linkstat:not([data-state="live"]){background:rgba(0,0,0,.8);box-shadow:0 1px 10px rgba(0,0,0,.5)}
    #linkstat:not([data-state="live"]) .txt{max-width:290px;opacity:1}
    #linkstat[data-state="checking"] .dot{background:#ffd479;opacity:1}
    #linkstat[data-state="stalled"]{color:#ffe3bb}
    #linkstat[data-state="stalled"] .dot{background:#ffb03a;opacity:1;animation:linkpulse 1.1s ease-in-out infinite}
    #linkstat[data-state="dropped"]{color:#ffd0d0}
    #linkstat[data-state="dropped"] .dot{background:#f0645a;opacity:1;animation:linkpulse .9s ease-in-out infinite}
    #linkstat[data-state="reconnecting"]{color:#cfe0ff}
    #linkstat[data-state="reconnecting"] .dot{background:#8fbaff;opacity:1;animation:linkpulse 1.1s ease-in-out infinite}
    /* the only states you can do anything about are the ones that offer the button */
    #linkstat[data-state="stalled"] button,#linkstat[data-state="dropped"] button{display:block}
    @keyframes linkpulse{0%,100%{opacity:1}50%{opacity:.3}}
    /* --- the button row: three states, told apart by SHAPE rather than by shade ---------------
       A tint is not a state.  Shaded-on against shaded-off is a difference you have to have seen
       before to read, which is why 🎙 and 🔈 sat there looking switched on while the microphone
       was off and the sound was muted.  So:
         ON        green glyph, nothing over it
         OFF       a dulled glyph AND a diagonal strike across it — the strike is the ONLY thing
                   that ever draws one, so a strike always means "off, tap me".  Two half-signals
                   read as clearly as one loud one, and neither of them has to shout.
         DISABLED  faded well past OFF, desaturated, and pointer-events:none, so it cannot be
                   mistaken for something worth tapping
       Anything that is an action rather than a toggle (📋) stays plain: it has no "off". */
    .gbtn{position:fixed;z-index:20;width:52px;height:52px;border-radius:26px;border:0;padding:0;
      background:rgba(0,0,0,.6);color:#cdd6df;font-size:22px;line-height:1;
      touch-action:manipulation;-webkit-tap-highlight-color:transparent;
      transition:color .12s ease,background .12s ease,opacity .12s ease}
    .gbtn[data-state="on"]{color:#7CFC9B}
    /* OFF dulls the glyph as well as striking it.  The glyph lives in its own .gg span for exactly
       one reason: opacity on the button would drag the strike down with it, and the strike is the
       one part that has to hold up against whatever the desktop puts behind it. */
    .gbtn .gg{transition:opacity .12s ease}
    .gbtn[data-state="off"] .gg{opacity:.72}
    .gbtn[data-state="disabled"]{color:rgba(255,255,255,.34);background:rgba(0,0,0,.3);
      opacity:.42;filter:grayscale(1);pointer-events:none}
    /* the strike is drawn TWICE — a dark stroke under a white one — for the same reason the
       trackpad cursor is: the desktop shows through these buttons, and a single-colour line
       disappears against half the things that can be behind it.  It is INSET rather than corner to
       corner, and thin: it only has to cross the glyph, not underline the whole button. */
    .gbtn::before,.gbtn::after{content:'';position:absolute;left:50%;top:50%;width:32px;
      transform:translate(-50%,-50%) rotate(45deg);opacity:0;
      transition:opacity .12s ease;pointer-events:none}
    .gbtn::before{height:5px;border-radius:2.5px;background:rgba(0,0,0,.92)}
    .gbtn::after{height:2px;border-radius:1px;background:#fff}
    .gbtn[data-state="off"]::before,.gbtn[data-state="off"]::after{opacity:1}
    /* --- latching modifier keys --------------------------------------------------------------
       ARMED is outlined: held for the next key, then it lets go by itself.
       LOCKED is filled AND breathing, because a modifier that quietly stays down is the trap
       this row exists to avoid — you should be able to see one from across the screen. */
    #mods{position:fixed;right:14px;bottom:var(--mods-bottom,78px);z-index:20;display:flex;gap:6px;
      transition:bottom .18s ease}
    .gmod{min-width:47px;height:38px;border-radius:10px;padding:0 7px;
      background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.16);color:#cdd6df;
      font:600 13px/1 -apple-system,system-ui,sans-serif;letter-spacing:.02em;
      touch-action:manipulation;-webkit-tap-highlight-color:transparent;
      transition:background .12s ease,color .12s ease,border-color .12s ease}
    .gmod[data-mod="armed"]{color:#7CFC9B;border-color:#7CFC9B;background:rgba(124,252,155,.18)}
    .gmod[data-mod="locked"]{color:#08130c;border-color:#7CFC9B;background:#7CFC9B;
      animation:modlock 1.5s ease-in-out infinite}
    @keyframes modlock{0%,100%{box-shadow:0 0 0 0 rgba(124,252,155,.6)}
                       50%{box-shadow:0 0 0 5px rgba(124,252,155,0)}}
    /* --- the warp panel: enrolled terminals, over the third data channel ----------------------
       DISPLAY:NONE WHEN CLOSED, which is doing real work rather than saving pixels: a hidden
       element is out of hit-testing entirely, so while the panel is shut the trackpad, the
       modifier row and the desktop underneath behave exactly as they did before it existed.
       Open, it DOES take pointer events — unlike the quality panel, which is a row of buttons over
       a live desktop.  This one is a list you tap and hold, so the taps are its own; that is the
       trade the ▤ button is asking you to make when you open it.
       Class names come from warp/dom/client.js and are the same ones its standalone page styles:
       .v .l .stale on a row, .t .c on a menu item, and selected / warn / bad / destructive. */
    #warpPanel{position:fixed;left:10px;right:10px;top:52px;bottom:150px;z-index:23;display:none;
      flex-direction:column;background:rgba(8,10,14,.93);border:1px solid rgba(255,255,255,.12);
      border-radius:12px;overflow:hidden;
      font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:#dce4ec}
    #warpHead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
      padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.1);color:#8a949c;flex:0 0 auto}
    #warpHead b{color:#dce4ec;font-weight:600;letter-spacing:.04em}
    #warpBody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
    #warpRows{list-style:none;margin:0;padding:0}
    #warpRows li{display:flex;align-items:center;gap:12px;padding:10px 12px;
      background:#161a20;border-bottom:1px solid #0c0e12;border-left:4px solid #5abe82;
      touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    #warpRows li.selected{background:#26303c}
    #warpRows li.warn{border-left-color:#fabe3c}
    #warpRows li.bad{border-left-color:#f04646}
    #warpRows li .v{font-size:14px;min-width:64px}
    #warpRows li .l{color:#8a949c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #warpRows li .stale{margin-left:auto;color:#5a646c;font-size:10px}
    #warpMenu{list-style:none;margin:0;padding:0;position:absolute;left:12px;right:12px;top:8px;
      box-shadow:0 10px 30px #000c;border-radius:9px;overflow:hidden}
    #warpMenu:empty{display:none}
    #warpMenu li{padding:12px 13px;background:#222c38;border-left:3px solid #dce4ec;
      border-bottom:1px solid #0c0e12;display:flex;gap:10px;touch-action:manipulation}
    #warpMenu li.destructive{background:#3a1c1c;border-left-color:#f04646;color:#ffb0b0}
    #warpMenu li .c{margin-left:auto;color:#8a949c;font-size:10px}
    #warpNote{padding:8px 12px;color:#8a949c;flex:0 0 auto;
      border-top:1px solid rgba(255,255,255,.08)}
  </style>
</head>
<body>
  <div id="screen"></div>
  <div id="hud">connecting…</div>
  <div id="diag"></div>
  <div id="linkstat" data-state="live" hidden><span class="dot"></span><span class="txt"></span
    ><button type="button">Reconnect</button></div>
  <div id="connstatus"><div class="card">
    <div class="who"><span class="nm"></span><span class="id"></span></div>
    <ol class="steps">
      <li><b></b><span class="lbl">Finding a route</span><span class="det"></span></li>
      <li><b></b><span class="lbl">Reaching your desktop</span><span class="det"></span></li>
      <li><b></b><span class="lbl">Connecting</span><span class="det"></span></li>
      <li><b></b><span class="lbl">Loading the screen</span><span class="det"></span></li>
    </ol>
    <div class="msg"></div>
  </div></div>
  <script type="module">
    import RFB from './novnc/core/rfb.js';
    import { generateSecretKey, getPublicKey, finalizeEvent, getEventHash } from 'https://esm.sh/nostr-tools@2.15.0/pure';
    import { SimplePool } from 'https://esm.sh/nostr-tools@2.15.0/pool';
    import { getConversationKey, encrypt as nip44Encrypt } from 'https://esm.sh/nostr-tools@2.15.0/nip44';
    import { wrapEvent, unwrapEvent } from 'https://esm.sh/nostr-tools@2.15.0/nip59';
    import { decode } from 'https://esm.sh/nostr-tools@2.15.0/nip19';
    // Ask glass for 16-bit RGB555 (see novnc/core/rfb.js): ~1/3 fewer bytes per pixel through
    // ZRLE, which matters a lot over the bandwidth-limited relay. Requires a glass build that
    // honors SetPixelFormat (the gateway points at one).
    window.__glassFbDepth = 16;
    const log = (...a) => console.log('[glass-nostr]', ...a);

    // A STUN server so the browser also gathers a server-reflexive (public) candidate for
    // NAT traversal; host candidates still cover the LAN case. Non-trickle: we gather fully
    // (host + srflx) before signaling, since our answer is one-shot.
    const pc = new RTCPeerConnection({ iceServers: [
      { urls: 'stun:stun.cloudflare.com:3478' },   // reachable through WARP (WARP is Cloudflare)
      { urls: 'stun:stun.l.google.com:19302' },
      // TURN relay for the symmetric-NAT / cellular case (coturn behind the frps).
      { urls: 'turn:turn.ynniv.com:3478', username: 'glass', credential: 'ro0DmshIO9HX7yTiKjWlBkvQalQNkAn' },
    ] });
    pc.oniceconnectionstatechange = () => log('ice', pc.iceConnectionState);
    pc.onconnectionstatechange = () => log('conn', pc.connectionState);

    // --- two-way audio (G.711/SRTP): level meters + play the box's track ----------------------
    let audioCtx = null;
    const ensureCtx = () => (audioCtx ||= new (window.AudioContext || window.webkitAudioContext)());
    const mkMeter = (label, color) => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:7px;font:11px ui-monospace,monospace;color:#cdd6df';
      const lab = document.createElement('span'); lab.textContent = label; lab.style.cssText = 'width:26px';
      const bar = document.createElement('div'); bar.style.cssText = 'flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden';
      const fill = document.createElement('div'); fill.style.cssText = `height:100%;width:0%;background:${color};transition:width .05s linear`;
      bar.appendChild(fill); row.append(lab, bar);
      return { row, set: p => { fill.style.width = Math.max(0, Math.min(100, p * 140)) + '%'; } };
    };
    const audioPanel = document.createElement('div');
    // bottom:140 rather than 78 — the modifier row now occupies the strip directly above the
    // button row, and on a portrait phone a left panel 190px wide reaches into it
    audioPanel.style.cssText = 'position:fixed;left:14px;bottom:140px;z-index:22;width:190px;display:none;' +
      'flex-direction:column;gap:6px;background:rgba(0,0,0,.55);padding:9px 11px;border-radius:11px';
    const txM = mkMeter('mic', '#7CFC9B'), rxM = mkMeter('box', '#8fbaff');
    audioPanel.append(txM.row, rxM.row); document.body.appendChild(audioPanel);
    const showAudio = () => { audioPanel.style.display = 'flex'; };
    const meterStream = (stream, setter) => {
      const ctx = ensureCtx(); const an = ctx.createAnalyser(); an.fftSize = 256;
      ctx.createMediaStreamSource(stream).connect(an);
      const buf = new Uint8Array(an.fftSize);
      const tick = () => { an.getByteTimeDomainData(buf);
        let s = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; s += v * v; }
        setter(Math.sqrt(s / buf.length)); requestAnimationFrame(tick); };
      tick();
    };
    // the box's VP8 video (our from-scratch encoder) shows in a corner panel
    const vidEl = document.createElement('video');
    vidEl.autoplay = true; vidEl.playsInline = true; vidEl.muted = true;
    vidEl.style.cssText = 'position:fixed;right:14px;bottom:140px;z-index:22;width:128px;height:128px;' +
      'border-radius:10px;background:#000;object-fit:contain;display:none;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)';
    document.body.appendChild(vidEl);
    // PRESENTED frames, which are not decoded frames, and the difference is the whole diagnosis of
    // "the screen is blank until I pinch".  getStats' framesDecoded says the decoder consumed the
    // RTP; requestVideoFrameCallback fires when a frame has actually been handed to the compositor.
    // Blank WITH this counter climbing is a LAYOUT fault — the pixels exist and are going somewhere
    // nobody can see.  Blank WITH it stopped is a PLAYBACK fault — the element is paused and is
    // holding its last picture.  They have the same symptom and opposite fixes, so both are counted
    // rather than guessed, and the count is on the hud so the next report arrives with the answer.
    let vidPresented = 0, vidPresentAt = 0;
    if (vidEl.requestVideoFrameCallback) {
      const onPresent = () => { vidPresented++; vidPresentAt = performance.now();
                                markAlive('video');   // a painted frame is the loudest proof there is
                                vidEl.requestVideoFrameCallback(onPresent); };
      vidEl.requestVideoFrameCallback(onPresent);
    }
    // A REJECTED play() IS A MESSAGE, AND THIS USED TO THROW IT AWAY.  autoplay+muted+playsInline
    // satisfies every current policy, but a track swap, a lost media session or an iOS resume can
    // still leave the element paused — and a paused <video> keeps showing its last frame, which is
    // indistinguishable from a dead link.  `.catch(() => {})` discarded the one line that would
    // have said which of the two it was.
    let playFails = 0, lastPlayTry = 0;
    const tryPlay = (why, force) => {
      if (!vidEl.play) return;
      const t = performance.now();
      // A 'pause' handler that calls play() is a loop if play() keeps failing; the explicit
      // callers (a user gesture, a resume) are exempt because those are exactly the moments a
      // policy that refused us before will accept us now.
      if (!force && t - lastPlayTry < 400) return;
      lastPlayTry = t;
      const p = vidEl.play();
      if (p && p.catch) p.catch(err => { playFails++;
        diag(`play() rejected (${why}): ${(err && err.name) || err}`); });
    };
    // Every state that means "there is something to play now", because each is a moment at which a
    // refusal earlier may no longer stand.
    for (const ev of ['loadedmetadata', 'loadeddata', 'canplay', 'pause', 'stalled', 'suspend'])
      vidEl.addEventListener(ev, () => { if (vidEl.paused) tryPlay(ev); });
    // A TOUCH IS A USER GESTURE and a user gesture is the one thing an autoplay policy cannot
    // refuse.  CAPTURE on window, because the trackpad's handlers are capture+stopPropagation on
    // #screen and a bubbling listener would never see the event; PASSIVE, so this can never
    // preventDefault and cannot change what the gesture layer does with the touch it is watching.
    window.addEventListener('touchstart', () => { if (vidEl.paused) tryPlay('touch', true); },
                            { capture: true, passive: true });
    // VIDEO-PRIMARY: the desktop arrives as VP8 video instead of over the VNC data channel.
    // noVNC's canvas stays (invisible) because the touch layer maps coordinates through it and
    // input still rides the data channel — we just don't look at its pixels.
    const videoPrimary = new URLSearchParams(location.search).get('video') !== '0';
    // THE VIDEO'S BOX IS THE CANVAS'S *UNTRANSFORMED* RECT AND THE ZOOM IS A TRANSFORM ON TOP OF
    // IT.  That is the invariant, and breaking it is what produced a blank screen a pinch cured.
    //
    // The trackpad zooms by transforming the canvas and gives the video the IDENTICAL transform
    // (see SYNCVID), so the canvas's getBoundingClientRect() ALREADY CONTAINS the zoom.  Writing
    // that rect into the video's left/top/width/height while the video still carries the transform
    // applies the zoom TWICE: at zoom 2 with any pan the picture lands wholly outside the viewport,
    // with frames still arriving, still decoding and still being presented — into a layer nobody
    // can see.  Any two-finger touch then runs the trackpad's own APPLYT -> SYNCVID, which rewrites
    // box and transform together, and the screen "comes back the moment I pinch".  Nothing in that
    // path calls play(), which is what rules the playback explanation out: a pinch cannot resume a
    // paused element, so what a pinch repairs is geometry.
    //
    // So read the transform the trackpad is holding (it publishes it), undo it to recover the
    // untransformed rect, and restate BOTH halves together.  Coalesced into one rAF per change:
    // polling this on a timer while pinching thrashed the compositor and hung the page on iOS.
    let syncPending = false, syncTries = 0;
    const syncVideoNow = () => {
      syncPending = false;
      if (!videoPrimary) return;
      const c = document.querySelector('#screen canvas');
      const r = c && c.getBoundingClientRect();
      if (!r || !r.width || !r.height) {
        // NOT A NO-OP, AND THE OLD ONE WAS.  noVNC creates and sizes this canvas from its own
        // handshake, so at track time it may not exist yet — and simply returning left the video at

    rfb.focusOnClick = true;

            'border-radius:7px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);' +

    // COMING BACK FROM THE BACKGROUND.  iOS suspends a backgrounded tab: the <video> element is

    // needs two separate things, and doing only one leaves the same symptom —

// warp/dom/client.js — the DOM encoding's client.  ONE copy, two hosts, no transport.
//
// This file is loaded verbatim by two pages that have nothing else in common:
//
//   warp/dom/client.html                                a standalone page over a WebSocket

//
// and it is the same file in both because the client's job does not vary with the link.  A frame

//

// node and does four things with a delta: create, replace content, re-anchor, remove.  It does not
// diff, does not reconcile, does not keep a shadow tree and does not know what a projection is —
// all of that happened on the server, which is what "the stream carries state, not events" buys.
//
// It also does not decide anything about safety.  The menu it draws is whatever the server sent
// it; it cannot invent a command, and if it tried, the server would refuse it at invocation
// (DESIGN.md rule 6).
//
// THE HOST OWNS THE ELEMENTS AND THE STYLESHEET.  This file writes exactly these class names and
// nothing else, so a page can look however it likes without touching the logic:
//
//   on a row       selected | warn | bad     and cells .v (value) .l (label) .stale (as-of)
//   on a menu item destructive              and cells .t (label)  .c (cost class)
//
// GESTURES ARE SCOPED TO A ROOT ELEMENT, which is the one thing the standalone page did not need
// and the panel absolutely does: a listener on `document` inside a remote-desktop client would eat
// the pointer events the trackpad lives on.  ATTACHGESTURES(root) listens on root only.

"use strict";
function makeWarpClient(opts) {
  const rowsEl = opts.rows;
  const menuEl = opts.menu;
  const send   = opts.send;                 // (object) -> void.  The whole of the transport.
  const onStat = opts.onStat || function () {};

  // key -> {key, node, in, after}.  This is the client's ENTIRE model.  The server holds the
  // memory of what we have been told; we hold the nodes it named and the anchor each one was given.
  const nodes = new Map();

  // Anchor key -> the records waiting for it.  THIS IS NOT DEFENSIVE PADDING, it is load-bearing,
  // and it is the one thing an anchor-based encoding needs that a rectangle-based one does not.
  //
  // A rectangle is absolute: deltas carrying rectangles can be applied in any order at all.  An
  // anchor is RELATIVE, so "insert X after Y" is unappliable until Y exists — and two independent
  // things make that happen:
  //
  //   * the reconciler emits within a priority band in reverse layout order, so a pass that
  //     appends two rows sends `r05 after r04` before it sends `r04`;
  //   * and even in layout order, the BUDGET can defer the anchor to a later pass entirely, which
  //     no ordering rule on the server could fix.
  //
  // So a node whose place we do not know yet is held OUT of the document rather than dropped into
  // a place we invented, and it is inserted the moment its anchor lands.  Guessing would put a row
  // in the wrong place and leave it there, which is exactly the silent-wrong-order failure this
  // encoding's positions exist to prevent.
  const waiting = new Map();

  // virtual DOM.  A :moved does not touch the node's content, which is the entire point of rule 2.
  function applyDelta(d) {
    const rec = nodes.get(d.key);
    switch (d.k) {
      case "appeared": {
        const li = document.createElement("li");
        li.dataset.key = d.key;
        paint(li, d);
        const r = {key: d.key, node: li, in: d.in, after: d.after};
        nodes.set(d.key, r);
        place(r);
        break;
      }
      case "changed": {
        if (!rec) return;
        paint(rec.node, d);
        rec.in = d.in; rec.after = d.after;
        place(rec);
        break;
      }
      case "moved": {
        if (!rec) return;
        rec.in = d.in; rec.after = d.after;
        place(rec);                   // content untouched: the node is re-anchored, not rebuilt
        break;
      }
      case "gone": {
        if (!rec) return;
        rec.node.remove();
        nodes.delete(d.key);
        break;

  // whole of the DOM's positional vocabulary and it is exactly what the server sends.
  function place(rec) {

    // debug toggle: bottom-left button to show/hide the whole diagnostics overlay (hud + log + copy)
    const dbgBtn = document.createElement('button');
    dbgBtn.appendChild(gGlyph('≡'));
    dbgBtn.className = 'gbtn';                      // same three states as the rest of the row
    dbgBtn.dataset.state = 'off';
    dbgBtn.setAttribute('aria-label', 'diagnostics');
    dbgBtn.style.cssText += 'bottom:14px;left:14px;z-index:31;font-size:26px';
    document.body.appendChild(dbgBtn);
    let dbgOn = false;                              // debug overlay hidden by default; ≡ toggles it
    const applyDbg = () => {
      const d = dbgOn ? '' : 'none';
      hud.style.display = d; diagEl.style.display = d; copyBtn.style.display = d;
      document.body.classList.toggle('dbg', dbgOn);   // moves the link pill clear of the hud
      setBtn(dbgBtn, dbgOn ? 'on' : 'off');
      // debug view and the clean connecting overlay are mutually exclusive: showing debug hides the
      // overlay; hiding debug brings the overlay back if we're still connecting (before first frame).
      if (dbgOn) connEl.style.display = 'none';
      else if (!connHidden) { connEl.style.display = ''; connEl.style.opacity = ''; }
    };
    dbgBtn.addEventListener('click', () => { dbgOn = !dbgOn; applyDbg(); });
    applyDbg();
    window.addEventListener('error', e => diag('JS-ERROR ' + (e.message || e.error)));
    window.addEventListener('unhandledrejection', e => diag('REJECT ' + ((e.reason && e.reason.message) || e.reason)));
    pc.addEventListener('iceconnectionstatechange', () => {
      diag('ice ' + pc.iceConnectionState);
      if (pc.iceConnectionState === 'failed') {
        if (!connHidden) { setConnRaw('Could not reach your desktop'); failConn(); }
        scheduleReconnect('ice failed');          // bounded; gives up loudly after 6 tries
      }
    });
    pc.addEventListener('connectionstatechange', () => diag('conn ' + pc.connectionState));
    pc.addEventListener('icegatheringstatechange', () => diag('gather ' + pc.iceGatheringState));
    pc.addEventListener('icecandidateerror', e => diag(`cand-err ${e.errorCode} ${e.url || ''} ${(e.errorText || '').slice(0,40)}`));
    ch.addEventListener('open', () => { diag('datachannel OPEN'); setStep(3);
                                        setBtn(pasteBtn, 'idle'); });
    // The session is gone, so none of these can do anything — and "cannot" has to look different
    // from "off", or the row goes on inviting taps that will not land.
    ch.addEventListener('close', () => { diag('datachannel CLOSE');
      for (const b of [pasteBtn, micBtn, spkBtn, qBtn]) setBtn(b, 'disabled'); });
    ch.addEventListener('error', e => diag('datachannel ERROR ' + ((e.error && e.error.message) || '')));
    // The handshake is the only place the box says what it is called, so it is the only place
    // that can teach the progress screen for next time.  See LEARNT-NAME.
    rfb.addEventListener('connect', () => { diag('RFB connect'); learnWho(rfb._fbName); });
    rfb.addEventListener('disconnect', e => diag('RFB disconnect ' + ((e.detail && e.detail.clean) ? 'clean' : 'UNCLEAN')));
    rfb.addEventListener('securityfailure', e => diag('RFB security-fail ' + ((e.detail && e.detail.reason) || '')));
    // heartbeat every 10s — but only log it when something's NOT fully healthy or the state
    // changed, so a steady-good session doesn't spam identical ♥ lines.
    let lastHb = '';
    setInterval(() => {
      const hb = `pc=${pc.connectionState} ice=${pc.iceConnectionState} dc=${ch.readyState} rfb=${rfb._rfbConnectionState || '?'}`;
      const healthy = pc.connectionState === 'connected' && ch.readyState === 'open' && rfb._rfbConnectionState === 'connected';
      if (!healthy || hb !== lastHb) diag('♥ ' + hb);
      lastHb = hb;
    }, 10000);

    // ============================================================================================
    // IS THE LINK STILL THERE?  (the part that used to have no answer)
    // ============================================================================================
    // Everything above reports to the DEBUG surfaces, so a session that died while the tab was in
    // the background stayed on screen looking exactly like a live one — the last frame is still
    // painted, `pc.connectionState` can sit at 'connected' long after nothing is arriving, and the
    // only test available was to drag a window title and see whether it moved.
    //
    // WHAT IS *NOT* A LIVENESS SIGNAL: video bytes.  The bottom rung of the ladder is 0.61 KB/s and
    // a desktop nobody is touching legitimately sends nearly nothing, for minutes.  "No video" is
    // the normal state of a healthy idle session, and alarming on it would be worse than silence.
    //
    // WHAT IS *NOT* A LIVENESS SIGNAL EITHER, and this was measured rather than assumed:
    // `candidate-pair.bytesReceived`.  ICE consent freshness (RFC 7675) does keep STUN moving both
    // ways for the life of the connection — but Chromium counts only DATA packets into bytesReceived
    // and packetsReceived.  Against a real ICE-lite answerer (which is what the box is) both sat at
    // exactly 0 for the whole life of an idle connection while consent checks ran every ~2.8 s.  So
    // bytesReceived is video-bytes by another name and would false-alarm identically.
    //
    // WHAT IS: the counters that ICE keeps for the checks themselves.  `responsesReceived` and
    // `totalRoundTripTime` advance on every consent response the box sends back, on an idle link,
    // costing nothing and needing no change at the far end.  They are summed here with
    // bytes/packets/requestsReceived rather than picked, because which of them a given browser
    // feeds is not a thing to assume — ANY of them advancing is proof something came back.
    //
    // AND, independently: the control channel.  `handle-control-message` on the box answers EVERY
    // json message with the current video-profile state, so '{"get":1}' is already a ping with an
    // already-implemented pong — no gateway change.  That one is worth more than consent, because
    // it proves the box's SESSION is pumping and not merely that its ICE thread is answering.
    //
    // Two independent signals, either of which clears the clock; a stall needs BOTH silent.
    const LINK_PING_MS = 10000;      // routine control-channel ping while visible
    const LINK_URGE_MS = 2500;       // ...and how often to re-ask once something looks wrong
    const LINK_STALL_MS = 14000;     // silence before the pill says so  (consent is every ~3-5 s)
    const LINK_DROP_MS = 30000;      // silence before we stop believing in it and reconnect
    const LINK_RESUME_GRACE_MS = 9000;   // proof-of-life window after returning from the background
    const LINK_BG_GAP_MS = 10000;        // a nap longer than this is worth re-proving

    let lastAlive = performance.now();   // last moment ANYTHING came back from the box
    let lastAliveWall = Date.now();      // ...in wall clock, which a frozen timer cannot fake
    let lastPingAt = 0;
    let rxSig = -1;                      // composite monotonic "something arrived" counter
    let rxSigSeen = false;               // did this browser give us ANY of those counters?
    let probeUntil = 0;                  // >0 while we are waiting for proof of life on resume
    let linkState = 'live', linkSaidLive = false, linkArmed = false;

    // Cheap enough to call per data-channel message and per presented video frame: it only touches
    // the DOM on a state CHANGE.
    function markAlive(why) {
      lastAlive = performance.now(); lastAliveWall = Date.now(); probeUntil = 0;
      // ...but NOT once a reload is already scheduled.  A link that is failing can still land the
      // odd consent response, and without this guard the pill flapped between "Reconnecting…" and
      // "Connected" once a second right up until the reload — which reads as a page that cannot
      // make up its mind, at the exact moment it most needs to be believed.
      if (linkState !== 'live' && !reconnecting) { diag('link alive again (' + why + ')'); setLink('live'); }
      // The reconnect budget exists to stop a dead box becoming a reload loop; a working session is
      // exactly the evidence that resets it.  Once per load, and only on a CONTROL-channel pong —
      // that is the signal that proves the box itself is running, not just its ICE thread.
      if (why === 'control' && !linkSaidLive) { linkSaidLive = true; clearReconnAttempts(); }
    }
    // Fold the candidate pair's received-side counters into one number.  Summed, not chosen: the
    // test is only ever "did this change", and a browser that omits half of them still answers it.
    function noteRxSig(pair) {
      let sig = 0; const have = [];
      for (const k of ['bytesReceived', 'packetsReceived', 'requestsReceived', 'responsesReceived']) {
        const v = pair[k]; if (typeof v === 'number') { sig += v; have.push(k); }
      }
      // microseconds: totalRoundTripTime accumulates one sample per consent response
      if (typeof pair.totalRoundTripTime === 'number') {
        sig += Math.round(pair.totalRoundTripTime * 1e6); have.push('totalRoundTripTime');
      }
      if (!have.length) return;                // nothing usable — fall back to the control channel
      // Logged once, because WHICH of these a browser feeds is the one thing that could not be
      // checked on the device this actually runs on.  If a stall is ever reported wrongly, this
      // line in the debug log says whether the ICE half of the check had anything to work with.
      if (!rxSigSeen) { rxSigSeen = true; diag('ice liveness counters: ' + have.join(' ')); }
      if (rxSig < 0) { rxSig = sig; return; }  // first sample is a baseline, not evidence
      if (sig !== rxSig) { rxSig = sig; markAlive('ice'); }
    }

    const LINK_TEXT = {
      live: 'Connected',
      checking: 'Checking the connection…',
      stalled: 'No data from your desktop',
      dropped: 'Connection lost',
      reconnecting: 'Reconnecting…',
    };
    // ONE function writes the status, and it writes BOTH surfaces — the pill and, when the
    // full-screen overlay is up, the overlay's message line.  The two cannot drift into different
    // vocabularies for the same condition because there is only one place either of them is set.
    function setLink(state, text) {
      const label = text || LINK_TEXT[state] || state;
      if (state !== linkState) diag('link ' + state + (text ? ' — ' + text : ''));
      linkState = state;
      linkEl.dataset.state = state;
      if (linkTxt.textContent !== label) linkTxt.textContent = label;
      // While the connecting/reconnecting overlay is on screen it IS the status; two things saying
      // the same thing in different words is how a vocabulary splits.
      linkEl.hidden = !connHidden;
      if (!connHidden && state !== 'live') setConnRaw(label);
    }
    linkBtn.addEventListener('click', e => {
      e.stopPropagation();
      diag('reconnect requested by hand');
      clearReconnAttempts();          // a deliberate tap is not one of the automatic tries
      reconnecting = false;           // ...and it overrides an attempt that is sitting in backoff
      scheduleReconnect('manual');
    });

    // Called once a second from the poll below, and immediately on returning to the foreground.
    function checkLink() {
      const now = performance.now();
      // NOT ARMED UNTIL THERE HAS BEEN A CONNECTION.  Getting one takes 10-20 s of relay round
      // trips during which nothing has arrived yet and nothing is wrong — judging that as a stall
      // would overwrite the connect sequence's own message with "no data for 15s" every time.
      // Setting up is the overlay's phase and it has its own failsafe; this one starts after.
      if (!linkArmed) {
        const ice = pc.iceConnectionState;
        if (pc.connectionState !== 'connected' && ice !== 'connected' && ice !== 'completed') return;
        linkArmed = true; lastAlive = now; lastAliveWall = Date.now();
        diag('link watch armed');
      }
      if (reconnecting) return;      // a reload is already booked; nothing here can change that
      const visible = document.visibilityState === 'visible';
      const quiet = now - lastAlive;
      // The ping is routine at LINK_PING_MS and urgent once anything looks wrong.  ~180 B per pong
      // at 10 s is 18 B/s — under 3% of the BOTTOM rung, and none of it on the video's budget.
      if (visible && ctrl.readyState === 'open' &&
          now - lastPingAt >= ((quiet > 6000 || probeUntil) ? LINK_URGE_MS : LINK_PING_MS)) {
        lastPingAt = now;
        try { ctrl.send('{"get":1}'); } catch (_) {}
      }
      // Ask to reconnect ON THE TRANSITION only.  scheduleReconnect refuses when there is no usable
      // credential, and that refusal does not latch — calling it every second would print the same
      // refusal into the log once a second forever.  The Reconnect button is what retries after a
      // refusal, which is the honest place for the decision anyway.
      const drop = (label, why) => {
        const first = linkState !== 'dropped';
        setLink('dropped', label);
        if (first) scheduleReconnect(why);
      };
      // A state the browser has already given up on needs no timer.
      const st = pc.connectionState, ist = pc.iceConnectionState;
      if (st === 'failed' || st === 'closed' || ist === 'failed' || ist === 'closed') {
        drop('Connection lost', 'pc ' + st + '/' + ist);
        return;
      }
      if (probeUntil) {                          // just came back — waiting to be shown otherwise
        if (now < probeUntil) { setLink('checking'); return; }
        probeUntil = 0;
        drop('Connection lost while you were away', 'no proof of life on resume');
        return;
      }
      if (quiet >= LINK_DROP_MS) {
        drop('Connection lost', 'silent ' + Math.round(quiet / 1000) + 's');
        return;
      }
      // 'disconnected' is the browser's own consent-failure verdict and arrives within a few
      // seconds — worth saying at once, but NOT as "no data for 0s", which is what counting from
      // lastAlive would produce here and is a straightforwardly false statement.
      if (ist === 'disconnected' && quiet < LINK_STALL_MS) {
        setLink('stalled', 'Connection interrupted');
        return;
      }
      if (quiet >= LINK_STALL_MS) {
        setLink('stalled', 'No data for ' + Math.round(quiet / 1000) + 's');
        return;
      }
      setLink('live');
    }

    // RETURNING TO THE FOREGROUND.  An iOS tab that has been away has had its timers throttled or
    // stopped outright, so NONE of the ages above mean anything at the moment we wake up: they say
    // we stopped looking, not that anything stopped arriving.  The old handler asked only whether
    // `pc.connectionState` was already 'failed'/'closed' — and a silently dead link sits at
    // 'connected' for a long time, which is precisely the case being complained about.
    //
    // So do not reason from the old numbers.  Throw them away, ask for proof NOW, and judge on the
    // answer within a bounded window.
    function onResume() {
      const gap = Date.now() - lastAliveWall;
      if (ctrl.readyState === 'open') { lastPingAt = performance.now(); try { ctrl.send('{"get":1}'); } catch (_) {} }
      // still setting up: the connect sequence owns the screen and its own failsafe owns the clock
      if (!linkArmed || reconnecting) { pollPath(); return; }
      if (gap < LINK_BG_GAP_MS) { pollPath(); return; }   // a glance away, not a session away
      rxSig = -1;                                  // require a FRESH advance, not the pre-nap value
      lastAlive = performance.now();               // the nap is not silence we can hold against it
      lastAliveWall = Date.now();
      probeUntil = performance.now() + LINK_RESUME_GRACE_MS;
      setLink('checking');
      diag('resumed after ' + (gap / 1000).toFixed(0) + 's away — probing the link');
      pollPath();                                  // now, rather than at the next 1 s tick
    }

    // getStats: which candidate pair won (host/srflx/relay), its rtt, and transport rx bytes
    let pathStr = 'path …', lastRx = 0, lastRxT = performance.now();
    let vidKbs = 0, vidFps = 0, lastVid = null;      // the VP8 stream's own rate, for the quality panel
    let lastKeyAsk = 0;                              // rate-limits the "I still have no picture" ask
    let lastHeal = 0;                                // ... and the repaint watchdog's intervention
    async function pollPath() {
      try {
        const s = await pc.getStats(); let pair = null;
        s.forEach(r => { if (r.type === 'candidate-pair' && r.state === 'succeeded' && (r.nominated || r.selected)) pair = r; });
        if (!pair) s.forEach(r => { if (r.type === 'transport' && r.selectedCandidatePairId) pair = s.get(r.selectedCandidatePairId); });
        if (pair) {
          const lc = s.get(pair.localCandidateId), rc = s.get(pair.remoteCandidateId);
          const rtt = pair.currentRoundTripTime != null ? Math.round(pair.currentRoundTripTime * 1000) + 'ms' : '?';
          const rx = pair.bytesReceived || 0, now = performance.now();
          const rate = ((rx - lastRx) / 1024 / ((now - lastRxT) / 1000)) || 0; lastRx = rx; lastRxT = now;
          noteRxSig(pair);           // the liveness signal — see the note above checkLink()
          const path = `${lc ? lc.candidateType : '?'}→${rc ? rc.candidateType : '?'}`;
          if (pathStr.indexOf(path) < 0) diag('PATH ' + path + ' via ' + (rc ? rc.protocol + ' ' + (rc.address || '?') : '?'));
          if (!connHidden) setDetail(2, `${path.replace('→', ' → ')}${rtt !== '?' ? '  ·  ' + rtt : ''}`);
          pathStr = `path ${path} rtt ${rtt} rx ${(rx/1024).toFixed(0)}KB ${rate.toFixed(0)}KB/s`;
        } else pathStr = 'path (no pair)';
        // the VIDEO's own rate and frame rate — dc-in above is the RFB channel, which in
        // video-primary mode carries input only.  This is the number a quality profile moves.
        let v = null; s.forEach(r => { if (r.type === 'inbound-rtp' && r.kind === 'video') v = r; });
        if (v) {
          const now = performance.now();
          if (lastVid) {
            const dt = (now - lastVid.t) / 1000;
            if (dt > 0.2) {
              vidKbs = ((v.bytesReceived || 0) - lastVid.b) / 1024 / dt;
              vidFps = ((v.framesDecoded || 0) - lastVid.f) / dt;
            }
          }
          // A DECIMAL, because the bottom of the ladder is 0.61 KB/s and "0 KB/s" beside a working
          // stream reads as a dead one.  kbps too — that is the unit the rung is named in.
          const prevB = lastVid ? lastVid.b : 0;
          lastVid = { t: now, b: v.bytesReceived || 0, f: v.framesDecoded || 0 };
          qRate.textContent = `${vidKbs.toFixed(1)} KB/s · ${(vidKbs * 8.192).toFixed(0)} kbps · ` +
                              `${vidFps.toFixed(0)} fps · ${vidPresented} shown`;
          // ---- THE REPAINT WATCHDOG ---------------------------------------------------------
          // The user should not have to pinch.  Bytes arriving is already measured above; what
          // this adds is whether those bytes reach the GLASS, and it distinguishes the two ways
          // they can fail to, because the corrective action is different for each:
          //
          //   * PLAYBACK.  The element is paused — nothing is being presented however much
          //     arrives.  Only play() helps, and only a policy can refuse it.
          //   * LAYOUT.  Frames are being presented, into a box that is 1x1 (never synced, because
          //     noVNC's canvas was not ready when we first looked) or wholly outside the viewport
          //     (the double-applied zoom above).  play() cannot help; restating the geometry can.
          //
          // Both are checked only while bytes are actually moving, so a genuinely dead link is
          // reported as dead rather than nudged forever, and at most one intervention every 3 s.
          const moving = vidKbs > 0.05;
          const vr = vidEl.getBoundingClientRect();
          const offscreen = vr.width < 2 || vr.height < 2 || vr.right <= 0 || vr.bottom <= 0 ||
                            vr.left >= innerWidth || vr.top >= innerHeight;
          const dark = vidPresentAt && (now - vidPresentAt > 4000);
          if (videoPrimary && moving && now - lastHeal > 3000) {
            if (vidEl.paused) {
              lastHeal = now;
              diag(`PAUSED with ${vidKbs.toFixed(1)} KB/s arriving — play()`);
              tryPlay('watchdog', true);
            } else if (dark) {
              lastHeal = now;
              diag(`no frame presented for ${((now - vidPresentAt) / 1000).toFixed(1)}s ` +
                   `(rs${vidEl.readyState} ${vidEl.videoWidth}x${vidEl.videoHeight}) — play() + resync`);
              tryPlay('stalled', true); syncVideo(); nudgeLayer();
            } else if (offscreen && vidPresented > 0) {
              lastHeal = now;
              diag(`presenting into an unseeable box ${Math.round(vr.width)}x${Math.round(vr.height)}` +
                   ` @ ${Math.round(vr.left)},${Math.round(vr.top)} — resync`);
              syncVideo(); nudgeLayer();
            }
          }
          // THE RECOVERY PATH.  The box parses no RTCP, so it cannot hear a PLI — if our decoder
          // never got a keyframe there is nothing to tell it except this channel, and its own blind
          // resync is minutes away at the low rungs by design.  Ask, but only when nothing is
          // already on its way: a keyframe takes 35 s to arrive at 5 kbps, and re-asking while it
          // is still in flight would restart it forever.
          if (videoPrimary && ctrl.readyState === 'open' && !(v.framesDecoded > 0) &&
              (v.bytesReceived || 0) === prevB && now - tStart > 6000 &&
              now - lastKeyAsk > 20000) {
            lastKeyAsk = now;
            ctrl.send(JSON.stringify({ request: 'keyframe' }));
            diag('no frame decoded and nothing arriving — keyframe requested');
          }
        }
      } catch (_) { pathStr = 'path stats-err'; }
    }

    let last = performance.now();
    setInterval(() => {
      pollPath();
      checkLink();          // judges the PREVIOUS tick's stats, which at 14 s thresholds is free
      const now = performance.now(), dt = (now - last) / 1000; last = now;
      const fps = frames / dt, kbs = bytesIn / 1024 / dt, mps = msgsIn / dt;
      frames = bytesIn = msgsIn = 0;
      const buf = ch.bufferedAmount || 0;
      hud.innerHTML =
        `pc <b>${pc.connectionState}</b> · ice <b>${pc.iceConnectionState}</b> · dc <b>${ch.readyState}</b>\n` +
        `${pathStr}\n` +
        `dc-in <b>${kbs.toFixed(0)}</b>KB/s ${mps.toFixed(0)}msg · buf ${(buf/1024).toFixed(0)}KB · fps <b>${fps.toFixed(0)}</b>\n` +
        // PRESENTED frames beside decoded ones, because that pair is the diagnosis: both climbing
        // and a blank screen means the layer is in the wrong place; "shown" frozen means playback.
        `vid <b>${vidKbs.toFixed(1)}</b>KB/s · <b>${vidFps.toFixed(0)}</b>fps · shown <b>${vidPresented}</b>` +
        `${vidEl.paused ? ' <b>PAUSED</b>' : ''}${playFails ? ' play✗' + playFails : ''}` +
        ` · rung <b>${qCurrent != null ? qCurrent + 'kbps' : '?'}</b>\n` +
        `rfb ${rfb._rfbConnectionState || '?'} · ${rfb._fbName || '—'}`;
      console.log(`PERF ${(now/1000).toFixed(1)} ${fps.toFixed(1)} ${kbs.toFixed(1)} ${mps.toFixed(1)} ${(buf/1024).toFixed(1)}`);
    }, 1000);

    // --- signaling: gift-wrapped Nostr, authorized by a one-time code OR a NIP-07 signer -------
    // The URL decides how you get in:
    //   * #…&code=<token> (from `login-link`, delivered to you in a gift-wrapped DM) -> connect
    //     with a throwaway EPHEMERAL key; no browser signer needed — holding the code is proof.
    //   * otherwise -> a NIP-07 signer (window.nostr) signs as your real identity, and the box
    //     admits you if you're on its allowlist.
    // The box npub + code live in the #hash fragment, which the nsite gateway never receives.
    // hud gets the raw text (debug); the clean overlay advances the step dots by phase
    const stepFor = {
      'gathering ICE candidates…': 0,
      'sending one-time-code offer…': 1,
      'gift-wrapping offer to the box…': 1,
      'offer sent — waiting for the box': 1,
      'answer received — establishing WebRTC…': 2,
    };
    const setStatus = s => { hud.textContent = s; log(s);
      const i = stepFor[s]; if (i !== undefined) setStep(i); else setConnRaw(s); };
    const params = new URLSearchParams(location.search);
    const hraw = location.hash.replace(/^#/, '');
    const hp = new URLSearchParams(hraw.includes('=') ? hraw : ('box=' + hraw));   // bare npub or box=/code=
    // WHICH BOX, remembered.  The magic link carries #box=…&code=…, but the code is short-lived and
    // the box npub never changes — so keeping the box lets a BARE url (…/k28.html, no fragment) find
    // the credentials already in localStorage.  That is what makes a new build reachable without
    // pulling a fresh link every time we publish.
    const BOX_KEY = 'glass-box';
    const storeBox = b => { try { localStorage.setItem(BOX_KEY, b); } catch (_) {} };
    const loadBox = () => {
      try {
        const b = localStorage.getItem(BOX_KEY);
        if (b) return b;
        // Nothing stored yet, but an earlier build may already hold this box's credentials under
        // glass-device:<box> / glass-code:<box>.  Recovering the box from those means an install
        // that predates this change gets bare-url access without needing a link first.
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i) || '';
          const m = k.match(/^glass-(?:device|code):(.+)$/);
          if (m && m[1] !== 'default') return m[1];
        }
      } catch (_) {}
      return '';
    };
    const urlBox = hp.get('box') || params.get('box') || '';
    if (urlBox) storeBox(urlBox);                                // arrived with a link: remember it
    // Last resort only: a link's #box wins, then what a previous link stored.  This is reached by
    // a fresh browser opening a bare URL, which cannot authenticate anyway — it exists so that
    // case fails at the door rather than with "no box configured".
    // ROTATION SITE: this is derived from the gateway's NOSTR_SEC.  Rotate that and this is stale,
    // and a fresh browser silently dials a box that no longer exists.  Rotated 2026-08-12.
    const boxArg = urlBox || loadBox() ||
      '804f867fba14b70a9a84542a982a79d3775356a3d105e03af4bf4fd6ed7cfb55';

    // ---- LEARNT-NAME: which box is this? ---------------------------------------------------
    // The question worth answering while someone is watching the progress list is "is this the
    // right desktop", and it has to be answered BEFORE the first packet — which rules out the
    // box telling us, because glass sends its name (GLASS:*DESKTOP-NAME*) in the RFB handshake,
    // three steps too late.
    //
    // So the box tells us once and we remember it: on connect we keep the RFB desktop name
    // against this box's pubkey, and every later visit reads it from localStorage and renders it
    // immediately.  Only the very first connection to a box shows a placeholder, and it is the
    // one time you cannot have picked the wrong one by habit.
    //
    // The pubkey prefix is shown underneath and is NOT decoration: a cached name can be stale
    // (a desktop renamed, a box rebuilt) while the key is the identity the connection is
    // actually made against.  Name to recognise, key to verify.
    const nameKey = 'glass-name:' + boxArg;
    const whoNm = document.querySelector('#connstatus .who .nm');
    const whoId = document.querySelector('#connstatus .who .id');
    const showWho = () => {
      let known = '';
      try { known = localStorage.getItem(nameKey) || ''; } catch (_) {}
      whoNm.textContent = known || 'this desktop — not seen before';
      whoNm.classList.toggle('unknown', !known);
      whoId.textContent = boxArg.slice(0, 12) + '…';
    };
    const learnWho = name => {
      const n = (name || '').trim();
      if (!n) return;
      let had = '';
      try { had = localStorage.getItem(nameKey) || ''; } catch (_) {}
      if (n === had) return;
      try { localStorage.setItem(nameKey, n); } catch (_) {}
      showWho();                       // a rename lands now, not on the next visit
      diag('desktop name: ' + n + (had ? ' (was "' + had + '")' : ''));
    };
    showWho();

    // ---- credential handling --------------------------------------------------------------
    // The token is  nonce.exp.mac  with exp a unix time, so the browser can judge its own
    // credential without asking anyone: an expired link is reported as expired instead of
    // surfacing later as a mysterious connection failure.  A valid code is kept in
    // localStorage (per box) and refreshed from every successful answer, so a reload — or a
    // reconnect after a drop — does not need a new magic link.
    const codeExp = c => { const p = String(c || '').split('.'); const e = parseInt(p[1], 10);
                           return (p.length === 3 && isFinite(e)) ? e * 1000 : 0; };
    const codeAlive = (c, marginMs = 0) => { const e = codeExp(c); return e > 0 && (e - marginMs) > Date.now(); };
    const CODE_KEY = 'glass-code:' + boxArg;      // the resolved box, so a bare url finds the same slot
    const storeCode = c => { try { if (codeAlive(c)) localStorage.setItem(CODE_KEY, c); } catch (_) {} };
    const loadCode = () => { try { const c = localStorage.getItem(CODE_KEY); return codeAlive(c) ? c : ''; } catch (_) { return ''; } };
    const urlCode = hp.get('code') || params.get('code') || '';
    if (urlCode && codeAlive(urlCode)) storeCode(urlCode);      // fresh link: remember it
    // prefer whichever credential is actually still valid
    let code = (codeAlive(urlCode) ? urlCode : '') || loadCode() || urlCode;
    window.__expiredCode = Boolean(code) && !codeAlive(code);
    const boxPub = boxArg.startsWith('npub') ? decode(boxArg).data : boxArg;
    const relays = (params.get('relays') ||
      'wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net').split(',');
    const nowSec = () => Math.floor(Date.now() / 1000);
    const pastTs = () => nowSec() - Math.floor(Math.random() * 172800);     // backdate seal/wrap ~2d

    // NIP-07 gift wrap: sign the seal through the signer (secret never exposed), wrap under a
    // throwaway key.  The code path instead uses nostr-tools wrapEvent with an ephemeral key we own.
    async function giftWrap07(signer, myPub, message) {
      const rumor = { pubkey: myPub, created_at: nowSec(), kind: 14, tags: [['p', boxPub]], content: message };
      rumor.id = getEventHash(rumor);
      const sealContent = await signer.nip44.encrypt(boxPub, JSON.stringify(rumor));
      const seal = await signer.signEvent({ kind: 13, created_at: pastTs(), tags: [], content: sealContent });
      const esk = generateSecretKey();
      const wrapContent = nip44Encrypt(JSON.stringify(seal), getConversationKey(esk, boxPub));
      return finalizeEvent({ kind: 1059, created_at: pastTs(), tags: [['p', boxPub]], content: wrapContent }, esk);
    }
    async function giftUnwrap07(signer, wrap) {
      const seal = JSON.parse(await signer.nip44.decrypt(wrap.pubkey, wrap.content));
      if (seal.pubkey !== boxPub) return null;                            // authenticate the box
      const rumor = JSON.parse(await signer.nip44.decrypt(seal.pubkey, seal.content));
      return rumor.content;
    }

    // ---- device identity ("remember this terminal") ----------------------------------------
    // The code path used a throwaway key per load, so the box could never recognise this browser
    // again.  Instead keep ONE key per box in localStorage and sign with it: the box enrols the
    // sender of any code-authorised offer for 24h, after which this device can ask for its own
    // fresh magic link over the same gift-wrapped DM channel — no user, no NIP-07 signer.
    const hex = u8 => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');
    const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
    const DEV_KEY = 'glass-device:' + boxArg;     // same slot whether the box came from the url or storage
    const hasDevice = () => { try { const h = localStorage.getItem(DEV_KEY); return !!h && h.length === 64; }
                              catch (_) { return false; } };
    const deviceSecret = () => {
      try {
        let h = localStorage.getItem(DEV_KEY);
        if (!h || h.length !== 64) { h = hex(generateSecretKey()); localStorage.setItem(DEV_KEY, h); }
        return unhex(h);
      } catch (_) { return generateSecretKey(); }      // private browsing: this load only
    };

    // Ask the box for a fresh code, signed by this device.  Reuses the self-service 'link' DM the
    // box already answers; the box decides whether this device is still enrolled.
    async function requestFreshCode(pool, sk) {
      const mine = getPublicKey(sk);
      return new Promise(resolve => {
        let done = false, sub = null;
        const finish = v => { if (!done) { done = true; try { sub && sub.close(); } catch (_) {} resolve(v); } };
        try {
          sub = pool.subscribeMany(relays, [{ kinds: [1059], '#p': [mine] }], {
            onevent: ev => {
              try {
                const r = unwrapEvent(ev, sk);
                if (r && r.pubkey === boxPub) {
                  const m = String(r.content).match(/code=([A-Za-z0-9.\-_]+)/);
                  if (m && codeAlive(m[1])) finish(m[1]);
                }
              } catch (_) {}
            },
          });
          pool.publish(relays, wrapEvent({ kind: 14, content: 'link', tags: [['p', boxPub]] }, sk, boxPub));
        } catch (_) { finish(null); }
        setTimeout(() => finish(null), 15000);
      });
    }

    // Choose an identity from the URL: a code -> this device's key; else -> NIP-07.
    async function makeIdentity() {
      // A code OR an already-enrolled device key.  The box admits three ways in — code, allowlist,
      // device — and honours an enrolled device for ~24h, renewing it on every admitted connection.
      // The page used to insist on a code, so it locked itself out as soon as the stored one aged
      // past its ~30 minute TTL, even though the box would still have taken us for another day.
      //
      // hasDevice(), not deviceSecret(): the latter MINTS a key when none exists, and a brand-new
      // key is by definition not enrolled — we would sign a well-formed offer the box then refuses.
      if (code || hasDevice()) {
        const sk = deviceSecret();
        return {
          pub: getPublicKey(sk), mode: code ? 'code' : 'device',
          wrapOffer: (payload) => wrapEvent({ kind: 14, content: payload, tags: [['p', boxPub]] }, sk, boxPub),
          unwrap: (ev) => { try { const r = unwrapEvent(ev, sk); return (r && r.pubkey === boxPub) ? r.content : null; }
                            catch { return null; } },
        };
      }
      const signer = window.nostr;
      if (!signer || !signer.nip44)
        throw new Error('No login code, no enrolled device, and no NIP-07 signer — open the one-time link from your DM, or use a Nostr signer.');
      const pub = await signer.getPublicKey();
      return { pub, mode: 'nip07',
               wrapOffer: (payload) => giftWrap07(signer, pub, payload),
               unwrap: (ev) => giftUnwrap07(signer, ev) };
    }

    (async () => {
      let id;
      // An expired credential is a distinct, actionable failure — say so up front rather than
      // letting it surface as an unexplained connection timeout minutes later.
      // An enrolled device is admitted on its own key, so a stale code is no reason not to try:
      // connect first (fast path) and only fall back to asking for a new link if the box stays
      // silent.  Give up only when there is genuinely nothing to try.
      const showNoCredential = () => {
        const when = codeExp(code) ? new Date(codeExp(code)) : null;
        setConnRaw(code ? 'This link has expired' : 'This terminal is not enrolled');
        connMsg.insertAdjacentHTML('afterend',
          '<div style="max-width:22em;font-size:13px;line-height:1.5;opacity:.75;margin-top:2px">' +
          (when ? 'It was valid until ' + when.toLocaleString() + '.<br>' : '') +
          'DM <b>link</b> to the box for a new one.</div>');
        failConn();
        diag('no usable credential' + (when ? ' (expired ' + when.toISOString() + ')' : ''));
      };
      if (!code && !hasDevice() && !window.nostr) { showNoCredential(); return; }
      window.__showNoCredential = showNoCredential;
      try { id = await makeIdentity(); } catch (e) { setStatus(e.message); return; }
      const pool = new SimplePool();

      // subscribe for the gift-wrapped ANSWER first, so we can't miss it.
      //
      // REPLAY: this filter has no since/limit, so relays hand us every gift wrap ever addressed to
      // this device key — including answers from previous sessions, which decrypt perfectly and look
      // exactly like a fresh one.  Applying a ghost points our ICE checks at an allocation that
      // expired hours ago: "ice failed / no pair", with a healthy-looking answer in the log.  (NIP-59
      // randomises the wrap's created_at up to two days into the past, so a `since` cannot fix this.)
      //
      // So we correlate instead: the box echoes back the ice-ufrag of the offer it is answering, and
      // that is minted per PeerConnection.  Ours or it is not our answer.  Old answers predate the
      // field entirely, which is how the backlog rejects itself.
      // Set once our offer exists (below).  Until then it is null and every answer is rejected —
      // which is correct: an answer to an offer we have not made yet is by definition a ghost, and
      // the backlog arrives the instant we subscribe, well before setLocalDescription.
      let answered = false, myUfrag = null;
      pool.subscribeMany(relays, [{ kinds: [1059], '#p': [id.pub] }], {
        onevent: async (ev) => {
          if (answered) return;
          try {
            let answer = await id.unwrap(ev);
            // the answer may be a {sdp, code} envelope: the box renews our credential on every
            // authenticated connection, so store the new one before using the SDP
            try {
              const env = JSON.parse(answer);
              if (env && env.sdp) {
                if (!myUfrag || env.ufrag !== myUfrag) {
                  diag(`ignored a replayed answer (ufrag ${env.ufrag || 'none'}, want ${myUfrag || 'pending'})`);
                  return;
                }
                if (env.code) { storeCode(env.code); diag('credential renewed'); }
                answer = env.sdp;
              }
            } catch (_) { /* not JSON — a bare SDP, which only the pre-envelope box ever sent */ }
            if (answer && answer.includes('m=application')) {
              answered = true;
              const ac = (answer.match(/a=candidate[^\r\n]*/g) || []);
              diag(`answer ${answer.length}B, ${ac.length} cand (${ac.filter(c=>c.includes('srflx')).length} srflx)`);
              clearTimeout(window.__answerWatchdog);
              await pc.setRemoteDescription({ type: 'answer', sdp: answer });
              const ms = window.__offerAt ? Math.round(performance.now() - window.__offerAt) : null;
              setDetail(1, ms != null ? `answered in ${(ms / 1000).toFixed(1)}s` : 'answered');
              setStatus('answer received — establishing WebRTC…');
            }
          } catch (_) { /* not for us / not from the box */ }
        },
      });

      // Audio starts MUTED both ways: opening the page must not prompt for the microphone or
      // grab the audio session from whatever is already playing.  A sendrecv transceiver with no
      // track still negotiates the m=audio line, and replaceTrack() attaches the real mic later
      // without renegotiation (which our one-shot Nostr signalling could not do anyway).
      try {
        window.__micSender = pc.addTransceiver('audio', { direction: 'sendrecv' }).sender;
        diag('audio negotiated (mic muted)');
      } catch (_) { try { pc.addTransceiver('audio', { direction: 'recvonly' }); } catch (_) {} }
      // ask for the box's VP8 video (we only receive; the box encodes it from scratch)
      try { pc.addTransceiver('video', { direction: 'recvonly' }); diag('video recvonly requested'); } catch (_) {}
      setStatus('gathering ICE candidates…');
      await pc.setLocalDescription(await pc.createOffer());
      // now we can recognise our own answer — see the replay note on the subscription above
      myUfrag = ((pc.localDescription.sdp || '').match(/a=ice-ufrag:(\S+)/) || [])[1] || null;
      // Non-trickle, but a blocked/slow STUN must NOT hang gathering (seen: 49s on cellular).
      // Cap the wait and send whatever we have — host is instant; srflx if it arrives in time.
      await new Promise(res => {
        let done = false;
        const finish = why => { if (!done) { done = true; diag('gather ' + why); res(); } };
        if (pc.iceGatheringState === 'complete') return finish('complete');
        pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') finish('complete'); });
        setTimeout(() => finish('timeout-10s'), 10000);   // give TURN relay time to gather
      });
      const cands = pc.localDescription.sdp.match(/a=candidate[^\r\n]*/g) || [];
      const nSrflx = cands.filter(c => c.includes('srflx')).length;
      const nRelay = cands.filter(c => c.includes('relay')).length;
      diag(`offer ${cands.length} cand: ${cands.length - nSrflx - nRelay} host ${nSrflx} srflx ${nRelay} relay`);
      setDetail(0, `${cands.length} routes · ${nRelay} relay`);
      window.__offerAt = performance.now();
      const payload = JSON.stringify(code ? { sdp: pc.localDescription.sdp, code } : { sdp: pc.localDescription.sdp });
      setStatus(id.mode === 'code' ? 'sending one-time-code offer…' : 'gift-wrapping offer to the box…');
      const wrap = await id.wrapOffer(payload);
      await Promise.any(pool.publish(relays, wrap));
      diag('offer published (' + id.mode + ')');
      setStatus('offer sent — waiting for the box');
      // Silence usually means our credential is dead.  If this terminal is still enrolled the box
      // will answer a device-signed link request, and we can carry on without the user.
      window.__answerWatchdog = setTimeout(async () => {
        if (pc.remoteDescription) return;
        if (!hasDevice()) return window.__showNoCredential();
        diag('no answer — asking the box for a fresh code');
        setConnRaw('Renewing access…');
        const fresh = await requestFreshCode(pool, deviceSecret());
        if (fresh) { storeCode(fresh); diag('renewed — reloading'); location.reload(); }
        else window.__showNoCredential();
      }, 18000);
    })();
  </script>
</body>
