<!doctype html>
<!-- NOTE: this standalone page is NOT what the nsite serves.  The deployed client is
     built from entry.mjs (see DEPLOY.md); the touch/gesture layer is duplicated here.
     A fix applied only to this file will not reach the device. -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>glass over WebRTC · Nostr (NIP-07)</title>
  <style>
    html,body{margin:0;height:100%;background:#111;overflow:hidden}#screen{width:100vw;height:100vh}
    #hud{position:fixed;top:0;left:0;right:0;z-index:12;font:11px/1.4 ui-monospace,Menlo,monospace;
         color:#7CFC9B;background:rgba(0,0,0,.72);padding:5px 8px;
         white-space:pre;pointer-events:none;text-shadow:0 0 2px #000}
    #hud b{color:#fff;font-weight:600}
    #diag{position:fixed;top:74px;left:0;right:0;z-index:12;max-height:40vh;overflow:hidden;
          font:10px/1.32 ui-monospace,Menlo,monospace;color:#a9d9ff;background:rgba(0,0,0,.5);
          padding:4px 8px;white-space:pre-wrap;pointer-events:none;text-shadow:0 0 2px #000}
    /* clean connecting overlay (non-debug), covers the blank screen until the first frame paints */
    #connstatus{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(130% 100% at 50% 38%,#141a21 0%,#0b0d11 100%);color:#e8eef2;
      font:15px/1.5 -apple-system,system-ui,sans-serif;transition:opacity .42s ease}
    #connstatus .card{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:28px}
    #connstatus .spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);
      border-top-color:#7CFC9B;animation:spin .9s linear infinite}
    #connstatus .msg{font-weight:500;letter-spacing:.01em;min-height:1.4em}
    #connstatus .steps{display:flex;gap:10px;margin-top:4px}
    #connstatus .steps i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.16);
      transition:background .3s ease}
    #connstatus .steps i.on{background:#7CFC9B}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="screen"></div>
  <div id="hud">connecting…</div>
  <div id="diag"></div>
  <div id="connstatus"><div class="card"><div class="spinner"></div><div class="msg">Starting…</div><div class="steps"><i></i><i></i><i></i><i></i></div></div></div>
  <script type="module">
    import RFB from './novnc/core/rfb.js';
    import { generateSecretKey, getPublicKey, finalizeEvent, getEventHash } from 'https://esm.sh/nostr-tools@2.15.0/pure';
    import { SimplePool } from 'https://esm.sh/nostr-tools@2.15.0/pool';
    import { getConversationKey, encrypt as nip44Encrypt } from 'https://esm.sh/nostr-tools@2.15.0/nip44';
    import { wrapEvent, unwrapEvent } from 'https://esm.sh/nostr-tools@2.15.0/nip59';
    import { decode } from 'https://esm.sh/nostr-tools@2.15.0/nip19';
    // Ask glass for 16-bit RGB555 (see novnc/core/rfb.js): ~1/3 fewer bytes per pixel through
    // ZRLE, which matters a lot over the bandwidth-limited relay. Requires a glass build that
    // honors SetPixelFormat (the gateway points at one).
    window.__glassFbDepth = 16;
    const log = (...a) => console.log('[glass-nostr]', ...a);

    // A STUN server so the browser also gathers a server-reflexive (public) candidate for
    // NAT traversal; host candidates still cover the LAN case. Non-trickle: we gather fully
    // (host + srflx) before signaling, since our answer is one-shot.
    const pc = new RTCPeerConnection({ iceServers: [
      { urls: 'stun:stun.cloudflare.com:3478' },   // reachable through WARP (WARP is Cloudflare)
      { urls: 'stun:stun.l.google.com:19302' },
      // TURN relay for the symmetric-NAT / cellular case (coturn behind the frps).
      { urls: 'turn:turn.ynniv.com:3478', username: 'glass', credential: 'ro0DmshIO9HX7yTiKjWlBkvQalQNkAn' },
    ] });
    pc.oniceconnectionstatechange = () => log('ice', pc.iceConnectionState);
    pc.onconnectionstatechange = () => log('conn', pc.connectionState);

    // --- two-way audio (G.711/SRTP): level meters + play the box's track ----------------------
    let audioCtx = null;
    const ensureCtx = () => (audioCtx ||= new (window.AudioContext || window.webkitAudioContext)());
    const mkMeter = (label, color) => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:7px;font:11px ui-monospace,monospace;color:#cdd6df';
      const lab = document.createElement('span'); lab.textContent = label; lab.style.cssText = 'width:26px';
      const bar = document.createElement('div'); bar.style.cssText = 'flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden';
      const fill = document.createElement('div'); fill.style.cssText = `height:100%;width:0%;background:${color};transition:width .05s linear`;
      bar.appendChild(fill); row.append(lab, bar);
      return { row, set: p => { fill.style.width = Math.max(0, Math.min(100, p * 140)) + '%'; } };
    };
    const audioPanel = document.createElement('div');
    audioPanel.style.cssText = 'position:fixed;left:14px;bottom:78px;z-index:22;width:190px;display:none;' +
      'flex-direction:column;gap:6px;background:rgba(0,0,0,.55);padding:9px 11px;border-radius:11px';
    const txM = mkMeter('mic', '#7CFC9B'), rxM = mkMeter('box', '#8fbaff');
    audioPanel.append(txM.row, rxM.row); document.body.appendChild(audioPanel);
    const showAudio = () => { audioPanel.style.display = 'flex'; };
    const meterStream = (stream, setter) => {
      const ctx = ensureCtx(); const an = ctx.createAnalyser(); an.fftSize = 256;
      ctx.createMediaStreamSource(stream).connect(an);
      const buf = new Uint8Array(an.fftSize);
      const tick = () => { an.getByteTimeDomainData(buf);
        let s = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; s += v * v; }
        setter(Math.sqrt(s / buf.length)); requestAnimationFrame(tick); };
      tick();
    };
    // the box's VP8 video (our from-scratch encoder) shows in a corner panel
    const vidEl = document.createElement('video');
    vidEl.autoplay = true; vidEl.playsInline = true; vidEl.muted = true;
    vidEl.style.cssText = 'position:fixed;right:14px;bottom:78px;z-index:22;width:128px;height:128px;' +
      'border-radius:10px;background:#000;object-fit:contain;display:none;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)';
    document.body.appendChild(vidEl);
    // VIDEO-PRIMARY: the desktop arrives as VP8 video instead of over the VNC data channel.
    // noVNC's canvas stays (invisible) because the touch layer maps coordinates through it and
    // input still rides the data channel — we just don't look at its pixels.
    const videoPrimary = new URLSearchParams(location.search).get('video') !== '0';
    // The video mirrors the canvas's ON-SCREEN rect, so it inherits the pan/zoom transform the
    // touch layer applies to the canvas without us transforming it twice.  Coalesced into one
    // rAF per change: polling this on a timer while pinching thrashed the compositor and hung
    // the page on iOS.
    let syncPending = false;
    const syncVideoNow = () => {
      syncPending = false;
      if (!videoPrimary) return;
      const c = document.querySelector('#screen canvas'); if (!c) return;
      const r = c.getBoundingClientRect();
      if (!r.width || !r.height) return;
      vidEl.style.left = r.left + 'px'; vidEl.style.top = r.top + 'px';
      vidEl.style.width = r.width + 'px'; vidEl.style.height = r.height + 'px';
    };
    const syncVideo = () => { if (!syncPending) { syncPending = true; requestAnimationFrame(syncVideoNow); } };
    window.__syncVideo = syncVideo;                 // the touch layer calls this after pan/zoom
    window.addEventListener('resize', syncVideo);
    window.addEventListener('orientationchange', syncVideo);
    pc.addEventListener('track', (e) => {
      const stream = e.streams[0] || new MediaStream([e.track]);
      if (e.track.kind === 'video') {
        diag('VIDEO track from box (VP8)');
        vidEl.srcObject = stream;
        if (videoPrimary) {                       // the video IS the desktop
          // pointer-events:none is essential — the virtual trackpad listens on #screen BENEATH
          // this element, so without it the video swallows every touch that lands on the desktop
          // and gestures only work in the margins around it.
          vidEl.style.cssText = 'position:fixed;z-index:5;background:#000;object-fit:fill;' +
            'pointer-events:none;left:0;top:0;width:1px;height:1px';
          const c = document.querySelector('#screen canvas');
          if (c) c.style.opacity = '0';           // keep it for input geometry, hide its pixels
          window.__vidEl = vidEl; window.__videoPrimary = true;
          syncVideo();
          // the loading overlay is normally dismissed by the first VNC framebuffer update, but
          // video-primary suppresses those entirely — so dismiss it on the first VIDEO frame.
          // Dismiss on a REAL first frame.  requestVideoFrameCallback fires per presented frame,
          // so it is the only honest signal here — 'playing' and 'unmute' both fire on negotiation,
          // before any pixels exist.
          const firstFrame = () => { syncVideo(); hideConn(); diag('first video frame'); };
          if (vidEl.requestVideoFrameCallback) vidEl.requestVideoFrameCallback(firstFrame);
          else vidEl.addEventListener('loadeddata', firstFrame, { once: true });
          // A timed failsafe must NOT hide the overlay: a blank screen with no explanation is worse
          // than a spinner.  If nothing has arrived by now, say what state we are actually in.
          setTimeout(() => {
            if (connHidden) return;
            if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
              setConnRaw('Connected — waiting for the first frame…');
            } else {
              setConnRaw('Could not reach your desktop');
              connMsg.insertAdjacentHTML('afterend',
                '<div style="max-width:22em;font-size:13px;line-height:1.5;opacity:.75;margin-top:2px">' +
                'The connection did not establish (ICE ' + pc.iceConnectionState + ').<br>' +
                'Tap ≡ for the log, or reload to try again.</div>');
              const sp = connEl.querySelector('.spinner'); if (sp) sp.style.display = 'none';
            }
          }, 12000);
          diag('video is the primary view');
        } else {
          vidEl.style.display = '';
        }
        const vp = vidEl.play && vidEl.play(); if (vp && vp.catch) vp.catch(() => {});
        // unmute fires on negotiation, not on pixels — do not claim frames from it
        e.track.addEventListener('unmute', () => { diag('video track unmuted (negotiated)'); if (videoPrimary) syncVideo(); });
        return;
      }
      diag('audio track from box (muted)');
      const au = document.createElement('audio'); au.autoplay = true; au.playsInline = true;
      au.muted = true; au.srcObject = stream;                 // muted: does not take the audio session
      document.body.appendChild(au);
      window.__boxAudio = au; window.__boxStream = stream;
      const p = au.play && au.play(); if (p && p.catch) p.catch(() => {});
    });

    // We open the channel; noVNC 1.7 rides the RTCDataChannel directly.
    const ch = pc.createDataChannel('rfb', { ordered: true });
    ch.binaryType = 'arraybuffer';
    ch.onopen = () => log('datachannel open');
    // A SECOND channel for control (video quality), NEGOTIATED on a fixed stream id so both ends
    // agree on it without a DCEP exchange and it can never be confused with the RFB stream — that
    // one carries a byte protocol with its own framing, and sharing it would mean teaching both
    // ends to tell RFB bytes from ours.  Nostr would also work and is the wrong tool: a relay
    // round-trip is seconds, and a quality comparison you make by eye needs the switch to land now.
    const ctrl = pc.createDataChannel('control', { ordered: true, negotiated: true, id: 100 });
    const rfb = new RFB(document.getElementById('screen'), ch, {});
    rfb.scaleViewport = true;
    rfb.focusOnClick = true;
    rfb.showDotCursor = true;      // desktop: draw a dot when the remote cursor is empty, so a
                                   // mouse user is never left with no pointer at all
    rfb.addEventListener('connect', () => { log('RFB connected'); rfb.focus(); });
    rfb.addEventListener('disconnect', e => log('RFB disconnect', e.detail));

    // --- mobile soft keyboard: iOS only shows it (and delivers keys) for a focused editable
    // element, and only after a user gesture.  A ⌨ button focuses a hidden input; we translate
    // its beforeinput/keydown into RFB key events (the canvas noVNC listens on can't do this).
    const kbin = document.createElement('input');
    kbin.setAttribute('autocapitalize', 'off'); kbin.setAttribute('autocorrect', 'off');
    kbin.setAttribute('autocomplete', 'off');   kbin.setAttribute('spellcheck', 'false');
    kbin.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;';
    document.body.appendChild(kbin);
    const kbBtn = document.createElement('button');
    kbBtn.textContent = '⌨';
    kbBtn.style.cssText = 'position:fixed;bottom:14px;right:14px;z-index:20;width:52px;height:52px;' +
      'border-radius:26px;border:0;background:rgba(0,0,0,.6);color:#7CFC9B;font-size:24px';
    kbBtn.addEventListener('click', () => kbin.focus());
    document.body.appendChild(kbBtn);
    // --- mic / speaker toggles, both MUTED on load -------------------------------------------
    const mkToggle = (glyph, right) => {
      const b = document.createElement('button');
      b.textContent = glyph;
      b.dataset.on = '0';
      b.style.cssText = 'position:fixed;bottom:14px;right:' + right + 'px;z-index:20;width:52px;' +
        'height:52px;border-radius:26px;border:0;background:rgba(0,0,0,.6);color:#8a949c;font-size:22px';
      document.body.appendChild(b);
      return b;
    };
    const paint = (b, on) => { b.dataset.on = on ? '1' : '0';
      b.style.color = on ? '#7CFC9B' : '#8a949c';
      b.style.background = on ? 'rgba(0,0,0,.6)' : 'rgba(0,0,0,.35)'; };
    const micBtn = mkToggle('🎙', 74), spkBtn = mkToggle('🔈', 134);
    micBtn.addEventListener('click', async () => {
      const on = micBtn.dataset.on === '1';
      if (on) {                                              // -> mute: drop the track entirely
        if (window.__micStream) { window.__micStream.getTracks().forEach(t => t.stop()); window.__micStream = null; }
        if (window.__micSender) { try { await window.__micSender.replaceTrack(null); } catch (_) {} }
        paint(micBtn, false); diag('mic muted');
      } else {                                               // -> unmute: NOW ask for permission
        try {
          const ms = await navigator.mediaDevices.getUserMedia(
            { audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
          window.__micStream = ms;
          if (window.__micSender) await window.__micSender.replaceTrack(ms.getAudioTracks()[0]);
          paint(micBtn, true); showAudio(); meterStream(ms, txM.set); diag('mic live');
        } catch (err) { diag('mic denied (' + (err.name || err) + ')'); }
      }
    });
    spkBtn.addEventListener('click', () => {
      const on = spkBtn.dataset.on === '1';
      const au = window.__boxAudio;
      if (on) { if (au) au.muted = true; paint(spkBtn, false); diag('speaker muted'); }
      else {
        if (au) { au.muted = false; const p = au.play && au.play(); if (p && p.catch) p.catch(() => {}); }
        paint(spkBtn, true); showAudio();
        if (window.__boxStream && !window.__rxMetered) { window.__rxMetered = true; meterStream(window.__boxStream, rxM.set); }
        diag('speaker on');
      }
    });
    // --- video quality: three profiles, switched on the running encoder ----------------------
    // The box changes its encoder's knobs mid-stream, so a tap costs nothing: same session, same
    // RTP stream, no reconnect.  The panel shows the video's OWN KB/s and fps beside the buttons,
    // because that is the trade-off being made — "responsive" is not better, it is more bytes for
    // a screen that keeps up while it moves.
    //
    // It must not eat gestures.  The touch layer listens on #screen, so anything parented to
    // <body> is already out of its way; on top of that the panel itself is pointer-events:none and
    // only the buttons take input, so a two-finger scroll or a hold that begins on the panel's
    // background still reaches the desktop underneath.
    const QPROFILES = ['responsive', 'balanced', 'sharp'];
    let qCurrent = null, qPending = null;
    const qPanel = document.createElement('div');
    qPanel.style.cssText = 'position:fixed;left:14px;bottom:140px;z-index:22;width:212px;display:none;' +
      'flex-direction:column;gap:7px;background:rgba(0,0,0,.55);padding:9px 11px;border-radius:11px;' +
      'font:11px ui-monospace,monospace;color:#cdd6df;pointer-events:none';
    const qHead = document.createElement('div');
    qHead.style.cssText = 'display:flex;justify-content:space-between;align-items:baseline;gap:8px';
    const qTitle = document.createElement('span'); qTitle.textContent = 'video';
    const qRate = document.createElement('span');
    qRate.style.cssText = 'color:#7CFC9B;font-variant-numeric:tabular-nums';
    qRate.textContent = '– KB/s · – fps';
    qHead.append(qTitle, qRate);
    const qRow = document.createElement('div'); qRow.style.cssText = 'display:flex;gap:5px';
    const qNote = document.createElement('div'); qNote.style.cssText = 'color:#8a949c;min-height:1.3em';
    const qBtns = {};
    const paintQ = () => {
      for (const [name, b] of Object.entries(qBtns)) {
        const on = name === qCurrent, wait = name === qPending;
        b.style.color = on ? '#7CFC9B' : (wait ? '#cdd6df' : '#8a949c');
        b.style.background = on ? 'rgba(124,252,155,.16)' : 'rgba(255,255,255,.06)';
        b.style.borderColor = on ? '#7CFC9B' : (wait ? 'rgba(255,255,255,.45)' : 'rgba(255,255,255,.18)');
      }
    };
    const sendProfile = name => {
      if (ctrl.readyState !== 'open') { qNote.textContent = 'control channel ' + ctrl.readyState; return; }
      qPending = name; paintQ(); qNote.textContent = 'switching to ' + name + '…';
      ctrl.send(JSON.stringify({ profile: name }));
      diag('profile -> ' + name);
    };
    for (const name of QPROFILES) {
      const b = document.createElement('button');
      b.textContent = name;
      // pointer-events:auto only on the button itself; touch-action stops the browser waiting to
      // see whether the tap was the start of a zoom
      b.style.cssText = 'pointer-events:auto;touch-action:manipulation;flex:1;padding:7px 4px;' +
        'border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);' +
        'color:#8a949c;font:10px ui-monospace,monospace';
      b.addEventListener('click', e => { e.stopPropagation(); sendProfile(name); });
      qBtns[name] = b; qRow.appendChild(b);
    }
    qPanel.append(qHead, qRow, qNote); document.body.appendChild(qPanel);
    // the box answers every message with the state it is ACTUALLY in, so the highlight follows the
    // encoder rather than the tap
    ctrl.addEventListener('message', e => {
      let m = null; try { m = JSON.parse(e.data); } catch (_) { return; }
      if (!m || !m.profile) return;
      qCurrent = m.profile; qPending = null; paintQ();
      qNote.textContent = `${m.target_kbs} KB/s cap · frame ≤${m.max_frame_kb} KB · settle ${m.cleanup_ms} ms`;
      diag('profile = ' + m.profile + ' (' + m.target_kbs + 'KB/s cap)');
    });
    ctrl.addEventListener('open', () => { diag('control channel OPEN'); ctrl.send('{"get":1}'); });
    ctrl.addEventListener('close', () => diag('control channel CLOSE'));
    // ◈ toggles the panel, like ≡ toggles the debug overlay
    const qBtn = mkToggle('◈', 194);
    let qOn = false;
    qBtn.addEventListener('click', () => {
      qOn = !qOn; qPanel.style.display = qOn ? 'flex' : 'none'; paint(qBtn, qOn);
      if (qOn && ctrl.readyState === 'open') ctrl.send('{"get":1}');
    });

    const XK = { Enter:0xff0d, Backspace:0xff08, Tab:0xff09, Escape:0xff1b,
                 ArrowLeft:0xff51, ArrowUp:0xff52, ArrowRight:0xff53, ArrowDown:0xff54 };
    const tap = (keysym, code) => { rfb.sendKey(keysym, code, true); rfb.sendKey(keysym, code, false); };
    const sendChar = ch => { const cp = ch.codePointAt(0); tap(cp < 0x100 ? cp : 0x01000000 + cp, null); };
    kbin.addEventListener('keydown', e => {          // special keys (fire keydown even on iOS)
      if (e.key in XK) { e.preventDefault(); tap(XK[e.key], e.code); }
    });
    kbin.addEventListener('beforeinput', e => {      // typed characters (iOS soft keyboard)
      if (e.inputType === 'insertText' && e.data) { for (const ch of e.data) sendChar(ch); e.preventDefault(); }
      else if (e.inputType === 'deleteContentBackward') { tap(XK.Backspace, 'Backspace'); e.preventDefault(); }
      else if (e.inputType && e.inputType.startsWith('insertLine') || e.inputType === 'insertParagraph') {
        tap(XK.Enter, 'Enter'); e.preventDefault();
      }
      kbin.value = '';
    });

    // Keep the desktop above the soft keyboard: when it opens the visual viewport shrinks, so pin
    // #screen to the visible height; noVNC's ResizeObserver refits the canvas and margin:auto
    // re-centers it in the remaining space above the keyboard.
    const vv = window.visualViewport;
    if (vv) {
      const screenEl = document.getElementById('screen');
      const fitViewport = () => {
        const up = (window.innerHeight - vv.height) > 120;       // keyboard (not just a rotation)
        screenEl.style.height = up ? vv.height + 'px' : '100vh';
      };
      vv.addEventListener('resize', fitViewport);
      vv.addEventListener('scroll', fitViewport);
    }

    // --- virtual trackpad (touch only): relative cursor motion, so your fingertip never hides the
    // target.  Drag = move cursor · quick tap = left-click · two-finger tap = right-click ·
    // pinch = zoom · two-finger drag = pan when zoomed / scroll when not · press-and-hold = grab
    // (a second concentric arc sweeps clockwise; when it closes the grab locks left, so you drag
    // windows / select until you lift).  Real mice keep noVNC's absolute pointer.
    //
    // Zoom is our own transform ON THE CANVAS (origin 0 0) — noVNC scales via the canvas's CSS
    // width/height and maps pointers with that (untransformed) scale, so our transform is free and
    // the pointer math stays exact.  vx/vy live in noVNC's element space [0, canvas.clientWidth];
    // the cursor ring maps to the screen through sx = rect.width / clientWidth (= our zoom).
    (() => {
      const screen = document.getElementById('screen');
      const canvasOf = () => screen.querySelector('canvas');
      const SENS = 1.6, TAP_MS = 250, TAP_SLOP = 10, SCROLL_PX = 24, ZMAX = 6, SL_SLOP = 30;
      const HOLD_MS = 500, ARM_AT = HOLD_MS / 2;             // press-and-hold to grab; arm at half
      let vx = 0, vy = 0, posInit = false, mask = 0;         // cursor (element px) + held buttons
      let lastX = 0, lastY = 0, startT = 0, moved = 0, fingers = 0;
      let dragging = false, scrollAcc = 0, holdRAF = 0, holdStart = 0;
      let zoom = 1, tx = 0, ty = 0;                          // our canvas transform (pan + zoom)
      let multi = false, multiT = 0, dPrev = 0, mpx = 0, mpy = 0, pinchMoved = 0;
      let slRAF = 0, slStart = 0, scrollLock = false, slAccX = 0, slAccY = 0;   // two-finger scroll-lock
      let slBaseX = 0, slBaseY = 0, slBaseD = 0;             // hold-start baseline (net-displacement arming)
      const nowMs = () => performance.now();
      const dist = ts => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);
      // white cursor drawn as SVG: an inner ring is the pointer; an outer arc grows clockwise as the
      // press-and-hold arms and, when it closes into a full second concentric ring, the grab locks.
      const NS = 'http://www.w3.org/2000/svg', C = 2 * Math.PI * 12;
      const svgEl = (n, a) => { const el = document.createElementNS(NS, n);
        for (const k in a) el.setAttribute(k, a[k]); return el; };
      const cur = svgEl('svg', { width: 40, height: 40, viewBox: '0 0 40 40' });
      cur.style.cssText = 'position:fixed;margin:-20px 0 0 -20px;pointer-events:none;z-index:15;display:none;overflow:visible';

      // re-positioning it from the canvas's (already transformed) rect: transforms are composited,
      // so both surfaces move together on the same frame instead of the video lagging a layout

        'glass-webrtc diag @ ' + new Date().toISOString(),

        `dc-in <b>${kbs.toFixed(0)}</b>KB/s ${mps.toFixed(0)}msg · buf ${(buf/1024).toFixed(0)}KB · fps <b>${fps.toFixed(0)}</b>\n` +
        `vid <b>${vidKbs.toFixed(0)}</b>KB/s · <b>${vidFps.toFixed(0)}</b>fps · profile <b>${qCurrent || '?'}</b>\n` +
        `rfb ${rfb._rfbConnectionState || '?'} · ${rfb._fbName || '—'}`;
      console.log(`PERF ${(now/1000).toFixed(1)} ${fps.toFixed(1)} ${kbs.toFixed(1)} ${mps.toFixed(1)} ${(buf/1024).toFixed(1)}`);
    }, 1000);

    // --- signaling: gift-wrapped Nostr, authorized by a one-time code OR a NIP-07 signer -------
    // The URL decides how you get in:
    //   * #…&code=<token> (from `login-link`, delivered to you in a gift-wrapped DM) -> connect
    //     with a throwaway EPHEMERAL key; no browser signer needed — holding the code is proof.
    //   * otherwise -> a NIP-07 signer (window.nostr) signs as your real identity, and the box
    //     admits you if you're on its allowlist.
    // The box npub + code live in the #hash fragment, which the nsite gateway never receives.
    // hud gets the raw text (debug); the clean overlay advances the step dots by phase
    const stepFor = {
      'gathering ICE candidates…': 0,
      'sending one-time-code offer…': 1,
      'gift-wrapping offer to the box…': 1,
      'offer sent — waiting for the box': 1,
      'answer received — establishing WebRTC…': 2,
    };
    const setStatus = s => { hud.textContent = s; log(s);
      const i = stepFor[s]; if (i !== undefined) setStep(i); else setConnRaw(s); };
    const params = new URLSearchParams(location.search);
    const hraw = location.hash.replace(/^#/, '');
    const hp = new URLSearchParams(hraw.includes('=') ? hraw : ('box=' + hraw));   // bare npub or box=/code=
    const boxArg = hp.get('box') || params.get('box') ||
      '75427ab8309aad26beea8142edf427674e4544604ae4dc5045108ad21fc8a0db';   // dev fallback
    // ---- credential handling --------------------------------------------------------------
    // The token is  nonce.exp.mac  with exp a unix time, so the browser can judge its own
    // credential without asking anyone: an expired link is reported as expired instead of
    // surfacing later as a mysterious connection failure.  A valid code is kept in
    // localStorage (per box) and refreshed from every successful answer, so a reload — or a
    // reconnect after a drop — does not need a new magic link.
    const codeExp = c => { const p = String(c || '').split('.'); const e = parseInt(p[1], 10);
                           return (p.length === 3 && isFinite(e)) ? e * 1000 : 0; };
    const codeAlive = (c, marginMs = 0) => { const e = codeExp(c); return e > 0 && (e - marginMs) > Date.now(); };
    const CODE_KEY = 'glass-code:' + (hp.get('box') || params.get('box') || 'default');
    const storeCode = c => { try { if (codeAlive(c)) localStorage.setItem(CODE_KEY, c); } catch (_) {} };
    const loadCode = () => { try { const c = localStorage.getItem(CODE_KEY); return codeAlive(c) ? c : ''; } catch (_) { return ''; } };
    const urlCode = hp.get('code') || params.get('code') || '';
    if (urlCode && codeAlive(urlCode)) storeCode(urlCode);      // fresh link: remember it
    // prefer whichever credential is actually still valid
    let code = (codeAlive(urlCode) ? urlCode : '') || loadCode() || urlCode;
    window.__expiredCode = Boolean(code) && !codeAlive(code);
    const boxPub = boxArg.startsWith('npub') ? decode(boxArg).data : boxArg;
    const relays = (params.get('relays') ||
      'wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net').split(',');
    const nowSec = () => Math.floor(Date.now() / 1000);
    const pastTs = () => nowSec() - Math.floor(Math.random() * 172800);     // backdate seal/wrap ~2d

    // NIP-07 gift wrap: sign the seal through the signer (secret never exposed), wrap under a
    // throwaway key.  The code path instead uses nostr-tools wrapEvent with an ephemeral key we own.
    async function giftWrap07(signer, myPub, message) {
      const rumor = { pubkey: myPub, created_at: nowSec(), kind: 14, tags: [['p', boxPub]], content: message };
      rumor.id = getEventHash(rumor);
      const sealContent = await signer.nip44.encrypt(boxPub, JSON.stringify(rumor));
      const seal = await signer.signEvent({ kind: 13, created_at: pastTs(), tags: [], content: sealContent });
      const esk = generateSecretKey();
      const wrapContent = nip44Encrypt(JSON.stringify(seal), getConversationKey(esk, boxPub));
      return finalizeEvent({ kind: 1059, created_at: pastTs(), tags: [['p', boxPub]], content: wrapContent }, esk);
    }
    async function giftUnwrap07(signer, wrap) {
      const seal = JSON.parse(await signer.nip44.decrypt(wrap.pubkey, wrap.content));
      if (seal.pubkey !== boxPub) return null;                            // authenticate the box
      const rumor = JSON.parse(await signer.nip44.decrypt(seal.pubkey, seal.content));
      return rumor.content;
    }

    // ---- device identity ("remember this terminal") ----------------------------------------
    // The code path used a throwaway key per load, so the box could never recognise this browser
    // again.  Instead keep ONE key per box in localStorage and sign with it: the box enrols the
    // sender of any code-authorised offer for 24h, after which this device can ask for its own
    // fresh magic link over the same gift-wrapped DM channel — no user, no NIP-07 signer.
    const hex = u8 => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');
    const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
    const DEV_KEY = 'glass-device:' + (hp.get('box') || params.get('box') || 'default');
    const hasDevice = () => { try { const h = localStorage.getItem(DEV_KEY); return !!h && h.length === 64; }
                              catch (_) { return false; } };
    const deviceSecret = () => {
      try {
        let h = localStorage.getItem(DEV_KEY);
        if (!h || h.length !== 64) { h = hex(generateSecretKey()); localStorage.setItem(DEV_KEY, h); }
        return unhex(h);
      } catch (_) { return generateSecretKey(); }      // private browsing: this load only
    };

    // Ask the box for a fresh code, signed by this device.  Reuses the self-service 'link' DM the
    // box already answers; the box decides whether this device is still enrolled.
    async function requestFreshCode(pool, sk) {
      const mine = getPublicKey(sk);
      return new Promise(resolve => {
        let done = false, sub = null;
        const finish = v => { if (!done) { done = true; try { sub && sub.close(); } catch (_) {} resolve(v); } };
        try {
          sub = pool.subscribeMany(relays, [{ kinds: [1059], '#p': [mine] }], {
            onevent: ev => {
              try {
                const r = unwrapEvent(ev, sk);
                if (r && r.pubkey === boxPub) {
                  const m = String(r.content).match(/code=([A-Za-z0-9.\-_]+)/);
                  if (m && codeAlive(m[1])) finish(m[1]);
                }
              } catch (_) {}
            },
          });
          pool.publish(relays, wrapEvent({ kind: 14, content: 'link', tags: [['p', boxPub]] }, sk, boxPub));
        } catch (_) { finish(null); }
        setTimeout(() => finish(null), 15000);
      });
    }

    // Choose an identity from the URL: a code -> this device's key; else -> NIP-07.
    async function makeIdentity() {
      if (code) {
        const sk = deviceSecret();
        return {
          pub: getPublicKey(sk), mode: 'code',
          wrapOffer: (payload) => wrapEvent({ kind: 14, content: payload, tags: [['p', boxPub]] }, sk, boxPub),
          unwrap: (ev) => { try { const r = unwrapEvent(ev, sk); return (r && r.pubkey === boxPub) ? r.content : null; }
                            catch { return null; } },
        };
      }
      const signer = window.nostr;
      if (!signer || !signer.nip44)
        throw new Error('No login code in the link, and no NIP-07 signer found — open the one-time link from your DM, or use a Nostr signer.');
      const pub = await signer.getPublicKey();
      return { pub, mode: 'nip07',
               wrapOffer: (payload) => giftWrap07(signer, pub, payload),
               unwrap: (ev) => giftUnwrap07(signer, ev) };
    }

    (async () => {
      let id;
      // An expired credential is a distinct, actionable failure — say so up front rather than
      // letting it surface as an unexplained connection timeout minutes later.
      // An enrolled device is admitted on its own key, so a stale code is no reason not to try:
      // connect first (fast path) and only fall back to asking for a new link if the box stays
      // silent.  Give up only when there is genuinely nothing to try.
      const showNoCredential = () => {
        const when = codeExp(code) ? new Date(codeExp(code)) : null;
        setConnRaw(code ? 'This link has expired' : 'This terminal is not enrolled');
        connMsg.insertAdjacentHTML('afterend',
          '<div style="max-width:22em;font-size:13px;line-height:1.5;opacity:.75;margin-top:2px">' +
          (when ? 'It was valid until ' + when.toLocaleString() + '.<br>' : '') +
          'DM <b>link</b> to the box for a new one.</div>');
        const sp = connEl.querySelector('.spinner'); if (sp) sp.style.display = 'none';
        diag('no usable credential' + (when ? ' (expired ' + when.toISOString() + ')' : ''));
      };
      if (!code && !hasDevice() && !window.nostr) { showNoCredential(); return; }
      window.__showNoCredential = showNoCredential;
      try { id = await makeIdentity(); } catch (e) { setStatus(e.message); return; }
      const pool = new SimplePool();

      // subscribe for the gift-wrapped ANSWER first, so we can't miss it
      let answered = false;
      pool.subscribeMany(relays, [{ kinds: [1059], '#p': [id.pub] }], {
        onevent: async (ev) => {
          if (answered) return;
          try {
            let answer = await id.unwrap(ev);
            // the answer may be a {sdp, code} envelope: the box renews our credential on every
            // authenticated connection, so store the new one before using the SDP
            try {
              const env = JSON.parse(answer);
              if (env && env.sdp) { if (env.code) { storeCode(env.code); diag('credential renewed'); } answer = env.sdp; }
            } catch (_) { /* plain SDP */ }
            if (answer && answer.includes('m=application')) {
              answered = true;
              const ac = (answer.match(/a=candidate[^\r\n]*/g) || []);
              diag(`answer ${answer.length}B, ${ac.length} cand (${ac.filter(c=>c.includes('srflx')).length} srflx)`);
              clearTimeout(window.__answerWatchdog);
              await pc.setRemoteDescription({ type: 'answer', sdp: answer });
              setStatus('answer received — establishing WebRTC…');
            }
          } catch (_) { /* not for us / not from the box */ }
        },
      });

      // Audio starts MUTED both ways: opening the page must not prompt for the microphone or
      // grab the audio session from whatever is already playing.  A sendrecv transceiver with no
      // track still negotiates the m=audio line, and replaceTrack() attaches the real mic later
      // without renegotiation (which our one-shot Nostr signalling could not do anyway).
      try {
        window.__micSender = pc.addTransceiver('audio', { direction: 'sendrecv' }).sender;
        diag('audio negotiated (mic muted)');
      } catch (_) { try { pc.addTransceiver('audio', { direction: 'recvonly' }); } catch (_) {} }
      // ask for the box's VP8 video (we only receive; the box encodes it from scratch)
      try { pc.addTransceiver('video', { direction: 'recvonly' }); diag('video recvonly requested'); } catch (_) {}
      setStatus('gathering ICE candidates…');
      await pc.setLocalDescription(await pc.createOffer());
      // Non-trickle, but a blocked/slow STUN must NOT hang gathering (seen: 49s on cellular).
      // Cap the wait and send whatever we have — host is instant; srflx if it arrives in time.
      await new Promise(res => {
        let done = false;
        const finish = why => { if (!done) { done = true; diag('gather ' + why); res(); } };
        if (pc.iceGatheringState === 'complete') return finish('complete');
        pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') finish('complete'); });
        setTimeout(() => finish('timeout-10s'), 10000);   // give TURN relay time to gather
      });
      const cands = pc.localDescription.sdp.match(/a=candidate[^\r\n]*/g) || [];
      const nSrflx = cands.filter(c => c.includes('srflx')).length;
      const nRelay = cands.filter(c => c.includes('relay')).length;
      diag(`offer ${cands.length} cand: ${cands.length - nSrflx - nRelay} host ${nSrflx} srflx ${nRelay} relay`);
      const payload = JSON.stringify(code ? { sdp: pc.localDescription.sdp, code } : { sdp: pc.localDescription.sdp });
      setStatus(id.mode === 'code' ? 'sending one-time-code offer…' : 'gift-wrapping offer to the box…');
      const wrap = await id.wrapOffer(payload);
      await Promise.any(pool.publish(relays, wrap));
      diag('offer published (' + id.mode + ')');
      setStatus('offer sent — waiting for the box');
      // Silence usually means our credential is dead.  If this terminal is still enrolled the box
      // will answer a device-signed link request, and we can carry on without the user.
      window.__answerWatchdog = setTimeout(async () => {
        if (pc.remoteDescription) return;
        if (!hasDevice()) return window.__showNoCredential();
        diag('no answer — asking the box for a fresh code');
        setConnRaw('Renewing access…');
        const fresh = await requestFreshCode(pool, deviceSecret());
        if (fresh) { storeCode(fresh); diag('renewed — reloading'); location.reload(); }
        else window.__showNoCredential();
      }, 18000);
    })();
  </script>
</body>
</html>
