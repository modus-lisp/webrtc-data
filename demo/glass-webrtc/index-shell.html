<!doctype html>
<!-- index-shell.html — the SHELL page: what nsite serves, and what is meant to stop changing.
     See shell.js for the whole argument.  In one line: everything that must run before a
     connection exists is here; everything that only matters once it does arrives over the
     connection, from the box, as payload.js — so most client changes need no publish at all.

     THE BUILD SPLICES shell.js IN.  `<script type="module" src="./shell.js">` below is a
     PLACEHOLDER: mksplit.py replaces the whole tag with the bundled, minified module, because the
     published page has to be a single self-contained blob (an nsite page that fetches a second
     file at runtime is a blank screen with nothing in the log). -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>glass over WebRTC · Nostr (NIP-07)</title>
  <style>
    html,body{margin:0;height:100%;background:#111;overflow:hidden}#screen{width:100vw;height:100vh}
    #hud{position:fixed;top:0;left:0;right:0;z-index:12;font:11px/1.4 ui-monospace,Menlo,monospace;
         color:#7CFC9B;background:rgba(0,0,0,.72);padding:5px 8px;
         white-space:pre;pointer-events:none;text-shadow:0 0 2px #000}
    #hud b{color:#fff;font-weight:600}
    #diag{position:fixed;top:74px;left:0;right:0;z-index:12;max-height:40vh;overflow:hidden;
          font:10px/1.32 ui-monospace,Menlo,monospace;color:#a9d9ff;background:rgba(0,0,0,.5);
          padding:4px 8px;white-space:pre-wrap;pointer-events:none;text-shadow:0 0 2px #000}
    /* clean connecting overlay (non-debug), covers the blank screen until the first frame paints */
    #connstatus{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(130% 100% at 50% 38%,#141a21 0%,#0b0d11 100%);color:#e8eef2;
      font:15px/1.5 -apple-system,system-ui,sans-serif;transition:opacity .42s ease}
    /* The connect sequence as a checklist: what is done, what is happening, what is still ahead.
       A spinner alone says "wait"; this says WHERE we are, and — once a step is behind us — what it
       actually found.  That second line is the part worth having: "3 relay candidates" or
       "relay->srflx 147ms" is exactly what you would otherwise open the debug log to learn. */
    #connstatus .card{display:flex;flex-direction:column;align-items:stretch;gap:14px;
      text-align:left;padding:28px;min-width:264px;max-width:min(86vw,340px)}
    /* Which box is this?  Answered before the first packet — see the note at LEARNT-NAME. */
    #connstatus .who{display:flex;flex-direction:column;gap:2px;margin:-4px 0 2px}
    #connstatus .who .nm{font-size:15px;font-weight:600;letter-spacing:.01em;color:#eef4f8}
    #connstatus .who .nm.unknown{font-weight:500;color:#9fb0bd}
    #connstatus .who .id{font-size:11.5px;font-variant-numeric:tabular-nums;color:#7d8b96;
      letter-spacing:.04em}
    #connstatus .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
    #connstatus .steps li{position:relative;display:grid;grid-template-columns:16px 1fr;
      column-gap:12px;padding:6px 0;color:rgba(232,238,242,.34);transition:color .4s ease}
    #connstatus .steps li .lbl{grid-column:2;grid-row:1;font-weight:500;letter-spacing:.01em}
    /* the detail collapses to nothing until its step completes, so future steps stay quiet */
    #connstatus .steps li .det{grid-column:2;grid-row:2;font-size:12.5px;font-variant-numeric:tabular-nums;
      color:rgba(232,238,242,.44);max-height:0;opacity:0;overflow:hidden;
      transition:max-height .4s ease,opacity .4s ease,margin .4s ease}
    #connstatus .steps li.done{color:#e8eef2}
    #connstatus .steps li.done .det{max-height:2.4em;opacity:1;margin-top:3px}
    #connstatus .steps li.now{color:#e8eef2}
    /* marker: hollow ring ahead, spinner now, filled behind */
    #connstatus .steps li b{grid-column:1;grid-row:1;width:14px;height:14px;margin-top:3px;
      box-sizing:border-box;border-radius:50%;border:2px solid rgba(255,255,255,.2);
      transition:border-color .4s ease,background .4s ease}
    #connstatus .steps li.done b{border-color:#7CFC9B;background:#7CFC9B}
    #connstatus .steps li.now b{border-color:rgba(124,252,155,.28);border-top-color:#7CFC9B;
      animation:spin .9s linear infinite}
    /* the rail: makes the list read as a sequence rather than four unrelated rows */
    #connstatus .steps li:not(:last-child)::before{content:'';position:absolute;left:7px;top:20px;
      bottom:-4px;width:2px;background:rgba(255,255,255,.12);transition:background .4s ease}
    #connstatus .steps li.done::before{background:rgba(124,252,155,.45)}
    #connstatus .steps li.fail{color:#ffd0d0}
    #connstatus .steps li.fail b{border-color:#f0645a;background:transparent;animation:none}
    #connstatus .msg{font-weight:500;letter-spacing:.01em;min-height:1.4em;text-align:center}
    #connstatus .msg:empty{min-height:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* --- the link-status pill -----------------------------------------------------------------
       The connecting overlay only exists until the first frame, and after that nothing on screen
       ever said whether the link was still there — so the only way to find out was to drag a
       window title and see if it moved.  This is the part that is always present.

       It is a 7px dot while the link is healthy and words only when there is something to say,
       because a status line you have learned to ignore is worth the same as no status line at
       all.  It never covers the desktop: 5px of top edge, centred, and the desktop shows through
       until the moment it has to be read. */
    #linkstat{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:26;
      display:flex;align-items:center;gap:8px;max-width:min(92vw,420px);
      padding:5px 9px;border-radius:16px;background:transparent;
      font:13px/1.25 -apple-system,system-ui,sans-serif;color:#e8eef2;
      pointer-events:none;transition:background .25s ease}
    /* display:flex above beats [hidden]'s UA display:none, so say it again */
    #linkstat[hidden]{display:none}
    /* the hud takes the top strip in debug mode; drop into the gap above the log rather than
       stacking on top of it */
    body.dbg #linkstat{top:72px}
    #linkstat .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:#7CFC9B;
      opacity:.4;transition:background .25s ease,opacity .25s ease}
    #linkstat .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      max-width:0;opacity:0;transition:max-width .3s ease,opacity .3s ease}
    #linkstat button{display:none;pointer-events:auto;touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;border:1px solid currentColor;background:transparent;
      color:inherit;border-radius:11px;padding:4px 10px;white-space:nowrap;
      font:600 12px/1 -apple-system,system-ui,sans-serif}
    /* ANYTHING that is not "live" says so in words.  One rule, so a state can never be added
       that lights the dot and forgets to explain itself. */
    #linkstat:not([data-state="live"]){background:rgba(0,0,0,.8);box-shadow:0 1px 10px rgba(0,0,0,.5)}
    #linkstat:not([data-state="live"]) .txt{max-width:290px;opacity:1}
    #linkstat[data-state="checking"] .dot{background:#ffd479;opacity:1}
    #linkstat[data-state="stalled"]{color:#ffe3bb}
    #linkstat[data-state="stalled"] .dot{background:#ffb03a;opacity:1;animation:linkpulse 1.1s ease-in-out infinite}
    #linkstat[data-state="dropped"]{color:#ffd0d0}
    #linkstat[data-state="dropped"] .dot{background:#f0645a;opacity:1;animation:linkpulse .9s ease-in-out infinite}
    #linkstat[data-state="reconnecting"]{color:#cfe0ff}
    #linkstat[data-state="reconnecting"] .dot{background:#8fbaff;opacity:1;animation:linkpulse 1.1s ease-in-out infinite}
    /* the only states you can do anything about are the ones that offer the button */
    #linkstat[data-state="stalled"] button,#linkstat[data-state="dropped"] button{display:block}
    @keyframes linkpulse{0%,100%{opacity:1}50%{opacity:.3}}
    /* --- the payload never came ---------------------------------------------------------------
       The shell is the whole client until the payload lands, so a payload that never arrives may
       not leave a spinner: it has to say what happened and offer the one thing that might help.
       It sits at the BOTTOM and does not cover the desktop, because if video is flowing then
       view-only is a real, usable state and hiding it would be a lie about how bad this is. */
    #payloadfail{position:fixed;left:10px;right:10px;bottom:14px;z-index:28;display:flex;
      flex-wrap:wrap;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;
      background:rgba(20,12,12,.92);border:1px solid rgba(240,100,90,.5);color:#ffd8d4;
      font:13px/1.4 -apple-system,system-ui,sans-serif;box-shadow:0 2px 18px rgba(0,0,0,.6)}
    #payloadfail button{margin-left:auto;pointer-events:auto;touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;border:1px solid currentColor;background:transparent;
      color:inherit;border-radius:11px;padding:6px 13px;white-space:nowrap;
      font:600 13px/1 -apple-system,system-ui,sans-serif}
    #payloadfail small{flex:1 0 100%;color:#c9a5a2;font:11px/1.35 ui-monospace,Menlo,monospace;
      word-break:break-word}
  </style>
</head>
<body>
  <!-- #screen is EMPTY and stays empty until the payload's noVNC builds a canvas in it.  It is in
       the shell rather than the payload because the trackpad listens on it and the soft-keyboard
       viewport fit resizes it, and both of those want an element that was always there. -->
  <div id="screen"></div>
  <div id="hud">connecting…</div>
  <div id="diag"></div>
  <div id="linkstat" data-state="live" hidden><span class="dot"></span><span class="txt"></span
    ><button type="button">Reconnect</button></div>
  <div id="connstatus"><div class="card">
    <div class="who"><span class="nm"></span><span class="id"></span></div>
    <ol class="steps">
      <li><b></b><span class="lbl">Finding a route</span><span class="det"></span></li>
      <li><b></b><span class="lbl">Reaching your desktop</span><span class="det"></span></li>
      <li><b></b><span class="lbl">Connecting</span><span class="det"></span></li>
      <li><b></b><span class="lbl">Loading the screen</span><span class="det"></span></li>
    </ol>
    <div class="msg"></div>
  </div></div>
  <script type="module" src="./shell.js"></script>
</body>
</html>
